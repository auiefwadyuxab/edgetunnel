name: 批量自动部署至 Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - domain.txt
  schedule:
    # 台湾时间每天 08:00
    - cron: "0 8 * * *"
      timezone: "Asia/Taipei"
    # 台湾时间每天 19:00
    - cron: "0 19 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch-deploy
  cancel-in-progress: false

jobs:
  batch-deploy:
    name: Batch Deploy & Update Domain List
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          check-latest: true
          package-manager-cache: false

      - name: Install Latest Wrangler
        shell: bash
        run: |
          set -euo pipefail

          WRANGLER_HOME="${RUNNER_TEMP}/wrangler"
          mkdir -p "${WRANGLER_HOME}"

          npm install \
            --prefix "${WRANGLER_HOME}" \
            --no-save \
            --no-package-lock \
            wrangler@latest

          "${WRANGLER_HOME}/node_modules/.bin/wrangler" --version

      - name: Download EdgeTunnel and Batch Deploy
        shell: bash
        env:
          CF_ACCOUNTS: ${{ secrets.CF_ACCOUNTS }}
          ADMIN_PASS: ${{ secrets.ADMIN }}
          UUID_CONFIG: ${{ secrets.UUID }}
          GITHUB_TOKEN: ${{ github.token }}
          WRANGLER_BIN: ${{ runner.temp }}/wrangler/node_modules/.bin/wrangler
        run: |
          set -euo pipefail

          # ==========================================================
          # 【可修改配置区】
          #
          # 这里只放“项目本身”的固定变量，方便以后修改。
          # ADMIN 按你的要求使用 plain_text，因此会直接显示在
          # Cloudflare Pages 项目配置中。
          # ==========================================================
          readonly UPSTREAM_REPO="cmliu/edgetunnel"
          readonly UPSTREAM_BRANCH="beta2.1"
          readonly DEFAULT_URL="https://cloudflare-error-page-3th.pages.dev"

          readonly PRELOAD_RACE_DIAL="1"
          readonly TCP_CONCURRENT_DIAL="4"
          readonly PROXY_CONCURRENT_DIAL="4"

          readonly KV_NAME="kv"
          readonly PAGES_PRODUCTION_BRANCH="main"
          readonly API_BASE="https://api.cloudflare.com/client/v4"

          # 运行环境检查
          : "${CF_ACCOUNTS:?❌ 未检测到 CF_ACCOUNTS Secrets 变量}"
          : "${ADMIN_PASS:?❌ 未检测到 ADMIN Secrets 变量}"
          : "${GITHUB_TOKEN:?❌ 未检测到 GITHUB_TOKEN 变量}"

          if [[ ! -x "${WRANGLER_BIN}" ]]; then
            echo "❌ Wrangler 未正确安装：${WRANGLER_BIN}"
            exit 1
          fi

          require_cmd() {
            command -v "$1" >/dev/null 2>&1 || {
              echo "❌ 缺少依赖：$1"
              exit 1
            }
          }

          require_cmd curl
          require_cmd jq
          require_cmd unzip
          require_cmd sha256sum
          require_cmd git

          readonly ZIP_URL="https://github.com/${UPSTREAM_REPO}/archive/refs/heads/${UPSTREAM_BRANCH}.zip"

          echo "=================================================="
          echo "🚀 EdgeTunnel 批量自动部署"
          echo "=================================================="
          echo "📦 上游仓库：${UPSTREAM_REPO}"
          echo "🌿 上游分支：${UPSTREAM_BRANCH}"
          echo "🔗 ZIP：${ZIP_URL}"
          echo "🌐 URL：${DEFAULT_URL}"
          echo "⚙️ PRELOAD_RACE_DIAL=${PRELOAD_RACE_DIAL}"
          echo "⚙️ TCP_CONCURRENT_DIAL=${TCP_CONCURRENT_DIAL}"
          echo "⚙️ PROXY_CONCURRENT_DIAL=${PROXY_CONCURRENT_DIAL}"
          echo "📦 KV：${KV_NAME}"
          echo "=================================================="

          # ==========================================================
          # 临时目录与清理
          # ==========================================================
          WORK_DIR="$(mktemp -d "${RUNNER_TEMP}/edgetunnel-deploy.XXXXXX")"
          trap 'rm -rf "${WORK_DIR}"' EXIT

          SOURCE_ZIP="${WORK_DIR}/source.zip"
          SOURCE_DIR="${WORK_DIR}/source"
          DOMAIN_NEXT="${WORK_DIR}/domain.next.txt"

          mkdir -p "${SOURCE_DIR}"

          # ==========================================================
          # 下载并校验上游代码
          # ==========================================================
          echo "⬇️ 正在下载 ${UPSTREAM_BRANCH}..."

          curl -fsSL \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 2 \
            -o "${SOURCE_ZIP}" \
            "${ZIP_URL}"

          unzip -tq "${SOURCE_ZIP}"
          unzip -q "${SOURCE_ZIP}" -d "${SOURCE_DIR}"

          PAYLOAD_DIR="$(
            find "${SOURCE_DIR}" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print -quit
          )"

          if [[ -z "${PAYLOAD_DIR}" || ! -d "${PAYLOAD_DIR}" ]]; then
            echo "❌ ZIP 结构异常，无法找到项目目录。"
            exit 1
          fi

          if [[ ! -f "${PAYLOAD_DIR}/_worker.js" ]]; then
            echo "❌ ${UPSTREAM_BRANCH} 中没有找到 _worker.js。"
            echo "❌ 为防止部署错误版本，本次任务终止。"
            exit 1
          fi

          # 上游配置不直接继承，下面会给每个项目生成一份明确的配置。
          rm -f "${PAYLOAD_DIR}/wrangler.toml"

          SOURCE_SHA="$(
            sha256sum "${SOURCE_ZIP}" | awk '{print $1}'
          )"

          # 使用 UTC 昨日作为安全兼容日期，避免出现未来日期问题。
          readonly COMPATIBILITY_DATE="$(date -u -d '1 day ago' +%Y-%m-%d)"

          echo "🗓️ Compatibility Date：${COMPATIBILITY_DATE}"
          echo "🔐 ZIP SHA256：${SOURCE_SHA}"

          if UPSTREAM_SHA="$(
            curl -fsSL \
              --retry 3 \
              --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "User-Agent: github-actions-edgetunnel-deployer" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/commits/${UPSTREAM_BRANCH}" |
            jq -r '.sha // empty'
          )"; then
            echo "🔖 ${UPSTREAM_BRANCH} 当前提交：${UPSTREAM_SHA}"
          else
            echo "⚠️ 无法获取 GitHub 当前 commit SHA，继续部署。"
          fi

          # ==========================================================
          # 解析 CF_ACCOUNTS
          #
          # 支持：
          #   ACCOUNT_ID:API_TOKEN
          #   ACCOUNT_ID:GLOBAL_API_KEY:EMAIL
          #
          # 两种格式混合使用也可以，一行一个账号。
          # ==========================================================
          declare -a ACCOUNT_IDS=()
          declare -a CREDENTIALS=()
          declare -a AUTH_TYPES=()
          declare -a AUTH_EMAILS=()

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value}"
          }

          while IFS= read -r raw_line || [[ -n "${raw_line}" ]]; do
            line="$(trim "${raw_line}")"

            [[ -z "${line}" ]] && continue
            [[ "${line}" =~ ^# ]] && continue

            account_id=""
            credential=""
            email=""
            extra=""
            IFS=':' read -r account_id credential email extra <<< "${line}"

            account_id="$(trim "${account_id}")"
            credential="$(trim "${credential}")"
            email="$(trim "${email}")"
            extra="$(trim "${extra}")"

            if [[ -n "${extra}" ]]; then
              echo "❌ CF_ACCOUNTS 格式错误：${line}"
              echo "   支持：ACCOUNT_ID:API_TOKEN"
              echo "   或：ACCOUNT_ID:GLOBAL_API_KEY:EMAIL"
              exit 1
            fi

            if [[ -z "${email}" ]]; then
              auth_type="api_token"
            else
              auth_type="global_key"
            fi

            if [[ ! "${account_id}" =~ ^[A-Fa-f0-9]{32}$ ]]; then
              echo "❌ 无效 Account ID：${account_id}"
              exit 1
            fi

            if [[ -z "${credential}" ]]; then
              echo "❌ Account ${account_id} 的凭证为空。"
              exit 1
            fi

            if [[ "${auth_type}" == "global_key" &&
                  ! "${email}" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
              echo "❌ Account ${account_id} 的 Global API Key 邮箱格式无效。"
              exit 1
            fi

            ACCOUNT_IDS+=("${account_id}")
            CREDENTIALS+=("${credential}")
            AUTH_TYPES+=("${auth_type}")
            AUTH_EMAILS+=("${email}")
          done <<< "${CF_ACCOUNTS}"

          readonly ACCOUNT_COUNT="${#ACCOUNT_IDS[@]}"

          if (( ACCOUNT_COUNT == 0 )); then
            echo "❌ CF_ACCOUNTS 没有有效账号。"
            exit 1
          fi

          echo "📦 共检测到 ${ACCOUNT_COUNT} 个 Cloudflare 账号。"

          # ==========================================================
          # UUID 聚合
          #
          # UUID Secret 格式：
          #   项目序号:UUIDv4
          #
          # 例如：
          #   1:xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx
          #
          # 含义：第 N 个项目作为 UUID 来源，其他项目统一使用该 UUID。
          # 为兼容现有工作方式，不主动改写“来源项目”本身。
          # ==========================================================
          UUID_TARGET_INDEX=""
          UUID_VALUE=""
          UUID_VALID=false

          if [[ -n "${UUID_CONFIG:-}" ]]; then
            if [[ "${UUID_CONFIG}" =~ ^([0-9]+):([[:xdigit:]]{8}-[[:xdigit:]]{4}-4[[:xdigit:]]{3}-[89abAB][[:xdigit:]]{3}-[[:xdigit:]]{12})$ ]]; then
              UUID_TARGET_INDEX="${BASH_REMATCH[1]}"
              UUID_VALUE="${BASH_REMATCH[2]}"

              if (( UUID_TARGET_INDEX >= 1 &&
                    UUID_TARGET_INDEX <= ACCOUNT_COUNT )); then
                UUID_VALID=true
                echo "🧩 UUID 聚合：来源项目=${UUID_TARGET_INDEX}"
                echo "   其他项目统一使用同一个 UUID。"
              else
                echo "⚠️ UUID 项目序号 ${UUID_TARGET_INDEX} 超出当前账号数量。"
                echo "⚠️ 本次跳过 UUID 聚合。"
              fi
            else
              echo "⚠️ UUID 配置格式无效：${UUID_CONFIG}"
              echo "⚠️ 正确格式：项目序号:UUIDv4"
              echo "⚠️ 本次跳过 UUID 聚合。"
            fi
          else
            echo "ℹ️ 未配置 UUID 聚合。"
          fi

          # ==========================================================
          # Cloudflare API 统一请求函数
          # ==========================================================
          api_request() {
            local index="$1"
            local method="$2"
            local url="$3"
            local data="${4:-}"

            local -a headers=(
              "-H" "Content-Type: application/json"
            )

            if [[ "${AUTH_TYPES[$index]}" == "global_key" ]]; then
              headers+=(
                "-H" "X-Auth-Email: ${AUTH_EMAILS[$index]}"
                "-H" "X-Auth-Key: ${CREDENTIALS[$index]}"
              )
            else
              headers+=(
                "-H" "Authorization: Bearer ${CREDENTIALS[$index]}"
              )
            fi

            if [[ "${method}" == "GET" ]]; then
              curl -fsSL \
                --retry 4 \
                --retry-all-errors \
                --retry-delay 2 \
                "${headers[@]}" \
                "${url}"
              return
            fi

            if [[ -n "${data}" ]]; then
              curl -sS \
                --retry 4 \
                --retry-all-errors \
                --retry-delay 2 \
                -X "${method}" \
                "${headers[@]}" \
                --data "${data}" \
                "${url}"
            else
              curl -sS \
                --retry 4 \
                --retry-all-errors \
                --retry-delay 2 \
                -X "${method}" \
                "${headers[@]}" \
                "${url}"
            fi
          }

          api_get() {
            api_request "$1" GET "$2"
          }

          api_post() {
            api_request "$1" POST "$2" "$3"
          }

          api_patch() {
            api_request "$1" PATCH "$2" "$3"
          }

          verify_env_vars() {
            local index="$1" admin="$2" url="$3" preload="$4" tcp="$5" proxy="$6"
            local uuid_required="${7:-false}" uuid_value="${8:-}"
            local account_id="${ACCOUNT_IDS[$index]}" project_name="$((index + 1))" resp=""
            resp="$(api_get "${index}" "${API_BASE}/accounts/${account_id}/pages/projects/${project_name}")" || return 1
            jq -e \
              --arg admin "${admin}" --arg url "${url}" --arg preload "${preload}" \
              --arg tcp "${tcp}" --arg proxy "${proxy}" --arg uuid "${uuid_value}" \
              --argjson uuid_required "${uuid_required}" \
              '.success == true
               and (.result.deployment_configs.production.env_vars.ADMIN.value // "") == $admin
               and (.result.deployment_configs.production.env_vars.URL.value // "") == $url
               and (.result.deployment_configs.production.env_vars.PRELOAD_RACE_DIAL.value // "") == $preload
               and (.result.deployment_configs.production.env_vars.TCP_CONCURRENT_DIAL.value // "") == $tcp
               and (.result.deployment_configs.production.env_vars.PROXY_CONCURRENT_DIAL.value // "") == $proxy
               and ($uuid_required == false or (.result.deployment_configs.production.env_vars.UUID.value // "") == $uuid)' \
              >/dev/null <<< "${resp}"
          }

          # ==========================================================
          # Pages 部署
          # ==========================================================
          run_pages_deploy() {
            local index="$1"
            local account_id="${ACCOUNT_IDS[$index]}"
            local project_name="$((index + 1))"

            if [[ "${AUTH_TYPES[$index]}" == "api_token" ]]; then
              env \
                -u CLOUDFLARE_API_KEY \
                -u CLOUDFLARE_EMAIL \
                CLOUDFLARE_ACCOUNT_ID="${account_id}" \
                CLOUDFLARE_API_TOKEN="${CREDENTIALS[$index]}" \
                "${WRANGLER_BIN}" pages deploy . \
                  --project-name="${project_name}" \
                  --branch="${PAGES_PRODUCTION_BRANCH}" \
                  --commit-dirty=true
            else
              env \
                -u CLOUDFLARE_API_TOKEN \
                CLOUDFLARE_ACCOUNT_ID="${account_id}" \
                CLOUDFLARE_API_KEY="${CREDENTIALS[$index]}" \
                CLOUDFLARE_EMAIL="${AUTH_EMAILS[$index]}" \
                "${WRANGLER_BIN}" pages deploy . \
                  --project-name="${project_name}" \
                  --branch="${PAGES_PRODUCTION_BRANCH}" \
                  --commit-dirty=true
            fi
          }

          # ==========================================================
          # 获取 Pages 自定义域
          #
          # 优先：active 的非 pages.dev 自定义域名
          # 如果自定义域尚未 active，则继续使用可用的 pages.dev 域名
          #
          # 这样用户后续手动绑定自定义域后，不需要再改 Secret。
          # ==========================================================
          get_preferred_domain() {
            local index="$1"
            local project_name="$2"
            local project_json="$3"
            local domains_json=""
            local custom_domain=""
            local pages_subdomain=""

            pages_subdomain="$(
              jq -r '.result.subdomain // empty' <<< "${project_json}"
            )"

            if domains_json="$(
              api_get \
                "${index}" \
                "${API_BASE}/accounts/${ACCOUNT_IDS[$index]}/pages/projects/${project_name}/domains"
            )"; then
              custom_domain="$(
                jq -r '
                  [
                    .result[]?
                    | select(
                        (.name // "") != ""
                        and ((.name | ascii_downcase) | endswith(".pages.dev") | not)
                        and (.status == "active")
                      )
                  ]
                  | sort_by(.name)
                  | .[0].name // empty
                ' <<< "${domains_json}"
              )"
            else
              echo "⚠️ 无法读取 Pages 自定义域列表，将使用 pages.dev。" >&2
            fi

            if [[ -n "${custom_domain}" ]]; then
              printf '%s\n' "${custom_domain}"
              return 0
            fi

            printf '%s\n' "${pages_subdomain}"
          }

          # ==========================================================
          # 结果数组
          # ==========================================================
          declare -a ADMIN_DOMAINS=()
          declare -a HOST_DOMAINS=()
          declare -a FAILED_PROJECTS=()

          DEPLOYED_COUNT=0

          # ==========================================================
          # 部署单个账号
          # ==========================================================
          deploy_one() {
            local index="$1"
            local account_id="${ACCOUNT_IDS[$index]}"
            local project_name="$((index + 1))"

            local project_resp=""
            local create_resp=""
            local kv_list=""
            local kv_id=""
            local config_patch=""
            local config_patch_resp=""
            local host=""
            local final_url=""

            echo ""
            echo "=================================================="
            echo "🚀 第 ${project_name} 个账号"
            echo "   Account ID: ${account_id}"
            echo "   Pages 项目: ${project_name}"
            echo "=================================================="

            # ----------------------------------------------------------
            # 1. 检查/创建 Pages 项目
            # ----------------------------------------------------------
            if project_resp="$(
              api_get \
                "${index}" \
                "${API_BASE}/accounts/${account_id}/pages/projects/${project_name}"
            )"; then
              if jq -e '.success == true and (.result.name // "") != ""' \
                >/dev/null <<< "${project_resp}"; then
                echo "✅ Pages 项目已存在。"
              else
                project_resp=""
              fi
            else
              project_resp=""
            fi

            if [[ -z "${project_resp}" ]]; then
              echo "📁 Pages 项目不存在，正在创建..."

              create_resp="$(
                api_post \
                  "${index}" \
                  "${API_BASE}/accounts/${account_id}/pages/projects" \
                  "$(jq -nc \
                    --arg name "${project_name}" \
                    --arg branch "${PAGES_PRODUCTION_BRANCH}" \
                    '{
                      name: $name,
                      production_branch: $branch
                    }')"
              )"

              if ! jq -e \
                '.success == true and (.result.name // "") != ""' \
                >/dev/null <<< "${create_resp}"; then
                echo "❌ 创建 Pages 项目失败："
                jq -c '{success,errors,messages}' \
                  <<< "${create_resp}" 2>/dev/null || true
                return 1
              fi

              project_resp="${create_resp}"
              echo "✅ Pages 项目创建成功。"
            fi

            # ----------------------------------------------------------
            # 2. 检查/创建 KV
            # ----------------------------------------------------------
            echo "📦 检查 KV：${KV_NAME}"

            if ! kv_list="$(
              api_get \
                "${index}" \
                "${API_BASE}/accounts/${account_id}/storage/kv/namespaces"
            )"; then
              echo "❌ 无法读取 KV 列表。"
              return 1
            fi

            if ! jq -e \
              '.success == true and (.result | type == "array")' \
              >/dev/null <<< "${kv_list}"; then
              echo "❌ KV API 返回异常："
              jq -c '{success,errors,messages}' \
                <<< "${kv_list}" 2>/dev/null || true
              return 1
            fi

            kv_id="$(
              jq -r \
                --arg title "${KV_NAME}" \
                '.result[]
                 | select(.title == $title)
                 | .id' \
                <<< "${kv_list}" |
              head -n 1
            )"

            if [[ -z "${kv_id}" || "${kv_id}" == "null" ]]; then
              echo "📦 未找到 '${KV_NAME}'，正在创建..."

              create_resp="$(
                api_post \
                  "${index}" \
                  "${API_BASE}/accounts/${account_id}/storage/kv/namespaces" \
                  "$(jq -nc \
                    --arg title "${KV_NAME}" \
                    '{title:$title}')"
              )"

              if ! jq -e \
                '.success == true and (.result.id // "") != ""' \
                >/dev/null <<< "${create_resp}"; then
                echo "❌ 创建 KV 失败："
                jq -c '{success,errors,messages}' \
                  <<< "${create_resp}" 2>/dev/null || true
                return 1
              fi

              kv_id="$(jq -r '.result.id' <<< "${create_resp}")"
              echo "✅ KV 创建成功：${kv_id}"
            else
              echo "✅ 已存在 KV：${kv_id}"
            fi

            # ----------------------------------------------------------
            # 3. 一次性写入 Pages 生产环境变量 + KV
            #    保持 Cloudflare deployment_configs.production 的原子结构
            # ----------------------------------------------------------
            config_patch="$(
              jq -nc \
                --arg admin "${ADMIN_PASS}" \
                --arg url "${DEFAULT_URL}" \
                --arg preload "${PRELOAD_RACE_DIAL}" \
                --arg tcp "${TCP_CONCURRENT_DIAL}" \
                --arg proxy "${PROXY_CONCURRENT_DIAL}" \
                --arg kv_id "${kv_id}" \
                '{deployment_configs:{production:{
                  env_vars:{
                    ADMIN:{type:"plain_text",value:$admin},
                    URL:{type:"plain_text",value:$url},
                    PRELOAD_RACE_DIAL:{type:"plain_text",value:$preload},
                    TCP_CONCURRENT_DIAL:{type:"plain_text",value:$tcp},
                    PROXY_CONCURRENT_DIAL:{type:"plain_text",value:$proxy}
                  },
                  kv_namespaces:{KV:{namespace_id:$kv_id}}
                }}}'
            )"

            UUID_CHECK_REQUIRED=false
            if [[ "${UUID_VALID}" == true && "${project_name}" != "${UUID_TARGET_INDEX}" ]]; then
              config_patch="$(
                jq --arg uuid "${UUID_VALUE}" \
                  '.deployment_configs.production.env_vars.UUID={type:"plain_text",value:$uuid}' \
                  <<< "${config_patch}"
              )"
              UUID_CHECK_REQUIRED=true
            fi

            config_patch_resp="$(
              api_patch "${index}" \
                "${API_BASE}/accounts/${account_id}/pages/projects/${project_name}" \
                "${config_patch}"
            )"

            if ! jq -e '.success == true' >/dev/null <<< "${config_patch_resp}"; then
              echo "❌ Pages 环境变量/KV 配置失败："
              jq -c '{success,errors,messages}' <<< "${config_patch_resp}" 2>/dev/null || true
              return 1
            fi

            if ! verify_env_vars "${index}" "${ADMIN_PASS}" "${DEFAULT_URL}" "${PRELOAD_RACE_DIAL}" "${TCP_CONCURRENT_DIAL}" "${PROXY_CONCURRENT_DIAL}" "${UUID_CHECK_REQUIRED}" "${UUID_VALUE}"; then
              echo "⚠️ Pages 环境变量回读验证失败，正在完整重写一次..."
              config_patch_resp="$(
                api_patch "${index}" \
                  "${API_BASE}/accounts/${account_id}/pages/projects/${project_name}" \
                  "${config_patch}"
              )"

              if ! jq -e '.success == true' >/dev/null <<< "${config_patch_resp}" || \
                 ! verify_env_vars "${index}" "${ADMIN_PASS}" "${DEFAULT_URL}" "${PRELOAD_RACE_DIAL}" "${TCP_CONCURRENT_DIAL}" "${PROXY_CONCURRENT_DIAL}" "${UUID_CHECK_REQUIRED}" "${UUID_VALUE}"; then
                echo "❌ Pages 环境变量写入后二次验证仍失败。"
                jq -c '{success,errors,messages}' <<< "${config_patch_resp}" 2>/dev/null || true
                return 1
              fi
            fi

            echo "✅ Pages 环境变量已写入并验证：ADMIN / URL / PRELOAD_RACE_DIAL / TCP_CONCURRENT_DIAL / PROXY_CONCURRENT_DIAL${UUID_CHECK_REQUIRED:+ / UUID}"
            echo "✅ Pages KV 配置已写入。"

            # ----------------------------------------------------------
            # 4. 生成项目专用 Wrangler 配置
            # ----------------------------------------------------------
            # 5. 生成项目专用 Wrangler 配置
            # ----------------------------------------------------------
            # 4. 生成项目专用 Wrangler 配置
            # ----------------------------------------------------------
            cat > "${PAYLOAD_DIR}/wrangler.toml" <<EOF
          name = "${project_name}"
          pages_build_output_dir = "."
          compatibility_date = "${COMPATIBILITY_DATE}"

          [[kv_namespaces]]
          binding = "KV"
          id = "${kv_id}"
          EOF

            # ----------------------------------------------------------
            # 5. 部署，失败时只重试一次
            # ----------------------------------------------------------
            echo "🌐 正在部署 Pages 项目 ${project_name}..."

            if ! (
              cd "${PAYLOAD_DIR}"
              run_pages_deploy "${index}"
            ); then
              echo "⚠️ 第 ${project_name} 个项目首次部署失败，重试一次..."

              if ! (
                cd "${PAYLOAD_DIR}"
                run_pages_deploy "${index}"
              ); then
                echo "❌ 第 ${project_name} 个项目部署失败。"
                return 1
              fi
            fi

            # ----------------------------------------------------------
                    # 6. 重新读取项目，验证 5 个环境变量 + UUID（如有）+ KV
          # ----------------------------------------------------------
          project_resp="$(
            api_get "${index}" \
              "${API_BASE}/accounts/${account_id}/pages/projects/${project_name}"
          )" || {
            echo "❌ 部署成功后无法读取 Pages 项目。"
            return 1
          }

          if ! jq -e \
            --arg admin "${ADMIN_PASS}" --arg url "${DEFAULT_URL}" \
            --arg preload "${PRELOAD_RACE_DIAL}" --arg tcp "${TCP_CONCURRENT_DIAL}" \
            --arg proxy "${PROXY_CONCURRENT_DIAL}" --arg kv_id "${kv_id}" \
            --arg uuid "${UUID_VALUE}" --argjson uuid_required "${UUID_CHECK_REQUIRED}" \
            '.success == true
             and (.result.deployment_configs.production.env_vars.ADMIN.value // "") == $admin
             and (.result.deployment_configs.production.env_vars.URL.value // "") == $url
             and (.result.deployment_configs.production.env_vars.PRELOAD_RACE_DIAL.value // "") == $preload
             and (.result.deployment_configs.production.env_vars.TCP_CONCURRENT_DIAL.value // "") == $tcp
             and (.result.deployment_configs.production.env_vars.PROXY_CONCURRENT_DIAL.value // "") == $proxy
             and ($uuid_required == false or (.result.deployment_configs.production.env_vars.UUID.value // "") == $uuid)
             and (.result.deployment_configs.production.kv_namespaces.KV.namespace_id // "") == $kv_id' \
            >/dev/null <<< "${project_resp}"; then
            echo "⚠️ 部署后配置回读验证失败，尝试完整重写 + 再部署一次..."

            config_patch_resp="$(
              api_patch "${index}" \
                "${API_BASE}/accounts/${account_id}/pages/projects/${project_name}" \
                "${config_patch}"
            )"
            if ! jq -e '.success == true' >/dev/null <<< "${config_patch_resp}"; then
              echo "❌ 完整重写 Pages 配置失败："
              jq -c '{success,errors,messages}' <<< "${config_patch_resp}" 2>/dev/null || true
              return 1
            fi

            if ! (cd "${PAYLOAD_DIR}" && run_pages_deploy "${index}"); then
              echo "❌ 完整重写后的重新部署失败。"
              return 1
            fi

            project_resp="$(api_get "${index}" "${API_BASE}/accounts/${account_id}/pages/projects/${project_name}")" || return 1
            if ! jq -e \
              --arg admin "${ADMIN_PASS}" --arg url "${DEFAULT_URL}" \
              --arg preload "${PRELOAD_RACE_DIAL}" --arg tcp "${TCP_CONCURRENT_DIAL}" \
              --arg proxy "${PROXY_CONCURRENT_DIAL}" --arg kv_id "${kv_id}" \
              --arg uuid "${UUID_VALUE}" --argjson uuid_required "${UUID_CHECK_REQUIRED}" \
              '.success == true
               and (.result.deployment_configs.production.env_vars.ADMIN.value // "") == $admin
               and (.result.deployment_configs.production.env_vars.URL.value // "") == $url
               and (.result.deployment_configs.production.env_vars.PRELOAD_RACE_DIAL.value // "") == $preload
               and (.result.deployment_configs.production.env_vars.TCP_CONCURRENT_DIAL.value // "") == $tcp
               and (.result.deployment_configs.production.env_vars.PROXY_CONCURRENT_DIAL.value // "") == $proxy
               and ($uuid_required == false or (.result.deployment_configs.production.env_vars.UUID.value // "") == $uuid)
               and (.result.deployment_configs.production.kv_namespaces.KV.namespace_id // "") == $kv_id' \
              >/dev/null <<< "${project_resp}"; then
              echo "❌ 第二次回读验证仍失败：Pages 配置没有完全落地。"
              return 1
            fi
          fi

            echo "✅ KV 绑定验证通过：KV -> ${kv_id}"

            # ----------------------------------------------------------
            # 7. 获取“自定义域优先，否则 pages.dev”的最终域名
            # ----------------------------------------------------------
            host=""

            for attempt in 1 2 3 4 5; do
              if host="$(
                get_preferred_domain \
                  "${index}" \
                  "${project_name}" \
                  "${project_resp}"
              )"; then
                host="$(trim "${host}")"
                if [[ -n "${host}" ]]; then
                  break
                fi
              fi

              echo "⏳ 获取最终域名第 ${attempt}/5 次失败，等待 2 秒..."
              sleep 2

              project_resp="$(
                api_get \
                  "${index}" \
                  "${API_BASE}/accounts/${account_id}/pages/projects/${project_name}"
              )" || true
            done

            if [[ -z "${host}" ]]; then
              echo "❌ 部署成功，但没有获取到可用域名。"
              return 1
            fi

            host="${host#https://}"
            host="${host#http://}"
            host="${host%%/*}"
            host="${host%.}"

            if [[ -z "${host}" ]]; then
              echo "❌ 域名清理后为空。"
              return 1
            fi

            final_url="https://${host}/admin"

            echo "🔗 管理地址：${final_url}"
            echo "🌐 Host：${host}"

            ADMIN_DOMAINS[$index]="${final_url}"
            HOST_DOMAINS[$index]="${host}"

            DEPLOYED_COUNT=$((DEPLOYED_COUNT + 1))

            echo "🎉 第 ${project_name} 个项目处理完成。"
          }

          # ==========================================================
          # 逐账号部署
          # ==========================================================
          for ((i=0; i<ACCOUNT_COUNT; i++)); do
            if ! deploy_one "${i}"; then
              FAILED_PROJECTS+=("$((i + 1))")
            fi
          done

          # ==========================================================
          # 同步最新远端的 domain.txt
          # 不 rebase 整个仓库，避免外部 push 导致无关冲突。
          # 本 workflow 最终只需要提交 domain.txt。
          # ==========================================================
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${GITHUB_REF_NAME}" --quiet

          if git cat-file -e "origin/${GITHUB_REF_NAME}:domain.txt" 2>/dev/null; then
            git checkout "origin/${GITHUB_REF_NAME}" -- domain.txt
          else
            rm -f domain.txt
          fi

          # ==========================================================
          # 读取旧 domain.txt
          #
          # 格式：
          #   第一段：/admin 地址
          #   空行
          #   第二段：Host
          #
          # 为了兼容旧仓库，也支持只有第一段的文件。
          # ==========================================================
          declare -a OLD_ADMIN_DOMAINS=()
          declare -a OLD_HOST_DOMAINS=()

          if [[ -f domain.txt ]]; then
            section="admin"

            while IFS= read -r old_domain || [[ -n "${old_domain}" ]]; do
              old_domain="${old_domain%$'\r'}"

              if [[ -z "${old_domain}" ]]; then
                section="host"
                continue
              fi

              if [[ "${section}" == "admin" ]]; then
                OLD_ADMIN_DOMAINS+=("${old_domain}")
              else
                OLD_HOST_DOMAINS+=("${old_domain}")
              fi
            done < domain.txt

            # 旧版只有 /admin 时，自动补 Host。
            if (( ${#OLD_HOST_DOMAINS[@]} == 0 &&
                  ${#OLD_ADMIN_DOMAINS[@]} > 0 )); then
              for old_domain in "${OLD_ADMIN_DOMAINS[@]}"; do
                if [[ "${old_domain}" =~ ^https?://([^/]+)/admin/?$ ]]; then
                  OLD_HOST_DOMAINS+=("${BASH_REMATCH[1]}")
                else
                  OLD_HOST_DOMAINS+=("")
                fi
              done
            fi
          fi

          # ==========================================================
          # 成功项目：采用本次检测到的新域名
          # 失败项目：完整保留旧域名
          # ==========================================================
          for ((i=0; i<ACCOUNT_COUNT; i++)); do
            if [[ -z "${ADMIN_DOMAINS[$i]:-}" &&
                  -n "${OLD_ADMIN_DOMAINS[$i]:-}" ]]; then
              ADMIN_DOMAINS[$i]="${OLD_ADMIN_DOMAINS[$i]}"
            fi

            if [[ -z "${HOST_DOMAINS[$i]:-}" &&
                  -n "${OLD_HOST_DOMAINS[$i]:-}" ]]; then
              HOST_DOMAINS[$i]="${OLD_HOST_DOMAINS[$i]}"
            fi
          done

          # ==========================================================
          # 生成 domain.txt
          # 严格按项目序号 1..N 输出，不排序、不去重。
          # 若本次有失败项目，不更新文件，避免列表错位。
          # ==========================================================
          if (( ${#FAILED_PROJECTS[@]} == 0 )); then
            : > "${DOMAIN_NEXT}"

            for ((i=0; i<ACCOUNT_COUNT; i++)); do
              printf '%s\n' "${ADMIN_DOMAINS[$i]}" >> "${DOMAIN_NEXT}"
            done

            printf '\n' >> "${DOMAIN_NEXT}"

            for ((i=0; i<ACCOUNT_COUNT; i++)); do
              printf '%s\n' "${HOST_DOMAINS[$i]}" >> "${DOMAIN_NEXT}"
            done
          else
            echo "⚠️ 检测到失败项目，本次不更新 domain.txt，避免列表与项目序号错位。"
            rm -f "${DOMAIN_NEXT}"
          fi

          # ==========================================================
          # 输出与提交
          # ==========================================================
          echo ""
          echo "┌────┬─────────────────────────────────────────────────────┐"
          echo "│ ID │ 最终管理地址                                        │"
          echo "├────┼─────────────────────────────────────────────────────┤"
          for ((i=0; i<ACCOUNT_COUNT; i++)); do
            printf '│ %2d │ %-51s │\n' "$((i + 1))" "${ADMIN_DOMAINS[$i]:-失败/无域名}"
          done
          echo "└────┴─────────────────────────────────────────────────────┘"

          if (( ${#FAILED_PROJECTS[@]} == 0 )); then
            echo ""
            echo "================ domain.txt ================"
            cat "${DOMAIN_NEXT}"
            echo "============================================="

            if [[ -f domain.txt ]] &&
               cmp -s "${DOMAIN_NEXT}" domain.txt; then
              echo "✨ domain.txt 内容无变化，跳过 Commit。"
              rm -f "${DOMAIN_NEXT}"
            else
              mv "${DOMAIN_NEXT}" domain.txt

              git add domain.txt
              git commit \
                -m "chore: auto update deployed domains list [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"

              echo "✅ domain.txt 已推送到 GitHub。"
            fi
          fi

          if (( ${#FAILED_PROJECTS[@]} > 0 )); then
            echo ""
            echo "❌ 以下项目本次未完整完成：${FAILED_PROJECTS[*]}"
            echo "ℹ️ 已成功部署：${DEPLOYED_COUNT}/${ACCOUNT_COUNT}"
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "🎉 全部 ${ACCOUNT_COUNT} 个项目部署完成！"
          echo "=================================================="
