name: 批量自动部署至 Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - domain.txt
      - .github/workflows/edgetunnel-settings.json
  schedule:
    # 台湾时间每天 08:00
    - cron: "0 8 * * *"
      timezone: "Asia/Taipei"
    # 台湾时间每天 19:00
    - cron: "0 19 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      preload_race_dial:
        description: "预加载竞速拨号 · 默认=不设置，启用=写入 1"
        required: true
        type: choice
        default: "默认（不设置）"
        options:
          - "默认（不设置）"
          - "启用（1）"
      tcp_concurrent_dial_mode:
        description: "TCP 并发拨号数 · 默认=不设置，自定义=填写正整数"
        required: true
        type: choice
        default: "默认（不设置）"
        options:
          - "默认（不设置）"
          - "自定义"
      tcp_concurrent_dial_value:
        description: "TCP 并发拨号数 · 仅选择“自定义”时使用"
        required: false
        type: string
        default: "2"
      proxy_concurrent_dial_mode:
        description: "反代并发拨号数 · 默认=不设置，自定义=填写正整数"
        required: true
        type: choice
        default: "默认（不设置）"
        options:
          - "默认（不设置）"
          - "自定义"
      proxy_concurrent_dial_value:
        description: "反代并发拨号数 · 仅选择“自定义”时使用；数值越高切换 IP 越频繁"
        required: false
        type: string
        default: "1"
      url_mode:
        description: "默认主页伪装地址 · 默认=不设置，自定义=填写 URL 或 1101"
        required: true
        type: choice
        default: "默认（不设置）"
        options:
          - "默认（不设置）"
          - "自定义"
      url_value:
        description: "默认主页伪装地址 · 仅选择“自定义”时使用；示例值可直接修改"
        required: false
        type: string
        default: "https://cloudflare-error-page-3th.pages.dev"
      proxyip_mode:
        description: "全局自定义反代 IP · 默认=不设置，自定义=填写地址"
        required: true
        type: choice
        default: "默认（不设置）"
        options:
          - "默认（不设置）"
          - "自定义"
      proxyip_value:
        description: "全局自定义反代 IP · 仅选择“自定义”时使用；示例值可直接修改"
        required: false
        type: string
        default: "proxyip.cmliussss.net:443"
      go2socks5_mode:
        description: "强制走 SOCKS5 的名单 · 默认=不设置，自定义=填写逗号分隔名单"
        required: true
        type: choice
        default: "默认（不设置）"
        options:
          - "默认（不设置）"
          - "自定义"
      go2socks5_value:
        description: "SOCKS5 名单 · 仅选择“自定义”时使用；逗号分隔，例如 README 示例"
        required: false
        type: string
        default: "blog.cmliussss.com,*.ip111.cn,*google.com"
      debug:
        description: "开发者模式 · 默认=关闭，启用=写入 1"
        required: true
        type: choice
        default: "默认（不设置）"
        options:
          - "默认（不设置）"
          - "启用（1）"
      off_log:
        description: "关闭 KV 日志记录 · 默认=保持开启，启用=写入 1"
        required: true
        type: choice
        default: "默认（不设置）"
        options:
          - "默认（不设置）"
          - "关闭日志（1）"
      best_sub:
        description: "优选订阅生成器 · 默认=关闭，启用=写入 1"
        required: true
        type: choice
        default: "默认（不设置）"
        options:
          - "默认（不设置）"
          - "启用（1）"

permissions:
  contents: write

concurrency:
  group: batch-deploy
  cancel-in-progress: false

jobs:
  batch-deploy:
    name: Batch Deploy & Update Domain List
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          check-latest: true
          package-manager-cache: false

      - name: Install Latest Wrangler
        shell: bash
        run: |
          set -euo pipefail

          WRANGLER_HOME="${RUNNER_TEMP}/wrangler"
          mkdir -p "${WRANGLER_HOME}"

          npm install \
            --prefix "${WRANGLER_HOME}" \
            --no-save \
            --no-package-lock \
            wrangler@latest

          "${WRANGLER_HOME}/node_modules/.bin/wrangler" --version

      - name: Download EdgeTunnel and Batch Deploy
        shell: bash
        env:
          CF_ACCOUNTS: ${{ secrets.CF_ACCOUNTS }}
          ADMIN_PASS: ${{ secrets.ADMIN }}
          UUID_CONFIG: ${{ secrets.UUID }}
          KEY_PASS: ${{ secrets.KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          WRANGLER_BIN: ${{ runner.temp }}/wrangler/node_modules/.bin/wrangler
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          INPUT_PRELOAD_RACE_DIAL: ${{ inputs.preload_race_dial }}
          INPUT_TCP_CONCURRENT_DIAL_MODE: ${{ inputs.tcp_concurrent_dial_mode }}
          INPUT_TCP_CONCURRENT_DIAL_VALUE: ${{ inputs.tcp_concurrent_dial_value }}
          INPUT_PROXY_CONCURRENT_DIAL_MODE: ${{ inputs.proxy_concurrent_dial_mode }}
          INPUT_PROXY_CONCURRENT_DIAL_VALUE: ${{ inputs.proxy_concurrent_dial_value }}
          INPUT_URL_MODE: ${{ inputs.url_mode }}
          INPUT_URL_VALUE: ${{ inputs.url_value }}
          INPUT_PROXYIP_MODE: ${{ inputs.proxyip_mode }}
          INPUT_PROXYIP_VALUE: ${{ inputs.proxyip_value }}
          INPUT_GO2SOCKS5_MODE: ${{ inputs.go2socks5_mode }}
          INPUT_GO2SOCKS5_VALUE: ${{ inputs.go2socks5_value }}
          INPUT_DEBUG: ${{ inputs.debug }}
          INPUT_OFF_LOG: ${{ inputs.off_log }}
          INPUT_BEST_SUB: ${{ inputs.best_sub }}
        run: |
          set -euo pipefail

          # ==========================================================
          # 【部署配置】
          #
          # 敏感变量（只允许来自 GitHub Secrets）：
          #   ADMIN / UUID / KEY
          #
          # 可选变量（只由本段处理）：
          #   PRELOAD_RACE_DIAL / TCP_CONCURRENT_DIAL /
          #   PROXY_CONCURRENT_DIAL / URL / PROXYIP /
          #   GO2SOCKS5 / DEBUG / OFF_LOG / BEST_SUB
          #
          # 9 个可选变量：
          # - workflow_dispatch 手动执行时读取本次选择；
          # - 自动执行（push / schedule）时读取最近一次手动执行保存的配置；
          # - “default” 表示完全不写入该变量，让 EdgeTunnel 自身采用默认值。
          #
          # 持久化配置只保存这 9 个非敏感变量，绝不保存 ADMIN / UUID / KEY。
          # ==========================================================
          readonly UPSTREAM_REPO="cmliu/edgetunnel"
          readonly UPSTREAM_BRANCH="beta2.1"

          # README 中给出的示例值；只有选择 custom 时才会作为输入框预填充。
          readonly URL_EXAMPLE="https://cloudflare-error-page-3th.pages.dev"
          readonly PROXYIP_EXAMPLE="proxyip.cmliussss.net:443"
          readonly GO2SOCKS5_EXAMPLE="blog.cmliussss.com,*.ip111.cn,*google.com"

          readonly KV_NAME="kv"
          readonly PAGES_PRODUCTION_BRANCH="main"
          readonly API_BASE="https://api.cloudflare.com/client/v4"
          readonly SETTINGS_FILE="${GITHUB_WORKSPACE}/.github/workflows/edgetunnel-settings.json"
          # 持久化文件仅包含 9 个非敏感变量；位置与本 workflow 同目录，便于维护。

          : "${CF_ACCOUNTS:?❌ 未检测到 CF_ACCOUNTS Secrets 变量}"
          : "${ADMIN_PASS:?❌ 未检测到 ADMIN Secrets 变量}"
          : "${GITHUB_TOKEN:?❌ 未检测到 GITHUB_TOKEN 变量}"
          : "${UUID_CONFIG:=}"
          : "${KEY_PASS:=}"
          if [[ -n "${KEY_PASS}" && "${KEY_PASS}" =~ [[:space:]] ]]; then
            echo "❌ KEY Secret 不能包含空白字符。"
            exit 1
          fi


          # ----------------------------------------------------------
          # 9 个可选变量的最终值：
          # 空字符串 = 不写入 Wrangler vars = 使用 EdgeTunnel 默认值。
          # ----------------------------------------------------------
          PRELOAD_RACE_DIAL=""
          TCP_CONCURRENT_DIAL=""
          PROXY_CONCURRENT_DIAL=""
          DEFAULT_URL=""
          PROXYIP=""
          GO2SOCKS5=""
          DEBUG=""
          OFF_LOG=""
          BEST_SUB=""

          optional_settings_json() {
            jq -n \
              --arg preload "${PRELOAD_RACE_DIAL}" \
              --arg tcp "${TCP_CONCURRENT_DIAL}" \
              --arg proxy "${PROXY_CONCURRENT_DIAL}" \
              --arg url "${DEFAULT_URL}" \
              --arg proxyip "${PROXYIP}" \
              --arg socks5 "${GO2SOCKS5}" \
              --arg debug "${DEBUG}" \
              --arg off_log "${OFF_LOG}" \
              --arg best_sub "${BEST_SUB}" \
              '{
                preload_race_dial: (if $preload == "" then null else $preload end),
                tcp_concurrent_dial: (if $tcp == "" then null else $tcp end),
                proxy_concurrent_dial: (if $proxy == "" then null else $proxy end),
                url: (if $url == "" then null else $url end),
                proxyip: (if $proxyip == "" then null else $proxyip end),
                go2socks5: (if $socks5 == "" then null else $socks5 end),
                debug: (if $debug == "" then null else $debug end),
                off_log: (if $off_log == "" then null else $off_log end),
                best_sub: (if $best_sub == "" then null else $best_sub end)
              }'
          }

          validate_positive_integer() {
            local variable_name="$1"
            local value="$2"

            if [[ ! "${value}" =~ ^[1-9][0-9]*$ ]]; then
              echo "❌ ${variable_name} 自定义值必须是正整数。"
              exit 1
            fi
          }

          load_persisted_optional_settings() {
            if [[ ! -f "${SETTINGS_FILE}" ]]; then
              return 0
            fi

            if ! jq -e '
              type == "object"
              and (keys | sort) == [
                "best_sub",
                "debug",
                "go2socks5",
                "off_log",
                "preload_race_dial",
                "proxy_concurrent_dial",
                "proxyip",
                "tcp_concurrent_dial",
                "url"
              ]
            ' "${SETTINGS_FILE}" >/dev/null 2>&1; then
              echo "❌ ${SETTINGS_FILE} 格式无效或包含未允许的字段。"
              echo "❌ 为避免错误变量进入批量部署，本次任务终止。"
              exit 1
            fi

            local settings_json
            settings_json="$(cat "${SETTINGS_FILE}")"

            PRELOAD_RACE_DIAL="$(jq -r '.preload_race_dial // ""' <<< "${settings_json}")"
            TCP_CONCURRENT_DIAL="$(jq -r '.tcp_concurrent_dial // ""' <<< "${settings_json}")"
            PROXY_CONCURRENT_DIAL="$(jq -r '.proxy_concurrent_dial // ""' <<< "${settings_json}")"
            DEFAULT_URL="$(jq -r '.url // ""' <<< "${settings_json}")"
            PROXYIP="$(jq -r '.proxyip // ""' <<< "${settings_json}")"
            GO2SOCKS5="$(jq -r '.go2socks5 // ""' <<< "${settings_json}")"
            DEBUG="$(jq -r '.debug // ""' <<< "${settings_json}")"
            OFF_LOG="$(jq -r '.off_log // ""' <<< "${settings_json}")"
            BEST_SUB="$(jq -r '.best_sub // ""' <<< "${settings_json}")"
          }

          validate_optional_settings() {
            if [[ -n "${PRELOAD_RACE_DIAL}" && "${PRELOAD_RACE_DIAL}" != "1" ]]; then
              echo "❌ PRELOAD_RACE_DIAL 持久化值只能是 1 或默认。"
              exit 1
            fi

            if [[ -n "${DEBUG}" && "${DEBUG}" != "1" ]]; then
              echo "❌ DEBUG 持久化值只能是 1 或默认。"
              exit 1
            fi

            if [[ -n "${OFF_LOG}" && "${OFF_LOG}" != "1" ]]; then
              echo "❌ OFF_LOG 持久化值只能是 1 或默认。"
              exit 1
            fi

            if [[ -n "${BEST_SUB}" && "${BEST_SUB}" != "1" ]]; then
              echo "❌ BEST_SUB 持久化值只能是 1 或默认。"
              exit 1
            fi

            if [[ -n "${TCP_CONCURRENT_DIAL}" ]]; then
              validate_positive_integer "TCP_CONCURRENT_DIAL" "${TCP_CONCURRENT_DIAL}"
            fi

            if [[ -n "${PROXY_CONCURRENT_DIAL}" ]]; then
              validate_positive_integer "PROXY_CONCURRENT_DIAL" "${PROXY_CONCURRENT_DIAL}"
            fi

            if [[ -n "${DEFAULT_URL}" ]]; then
              if [[ "${DEFAULT_URL}" != "1101" && ! "${DEFAULT_URL}" =~ ^https?://[^[:space:]]+$ ]]; then
                echo "❌ URL 自定义值必须是 HTTP/HTTPS URL，或 README 支持的 1101。"
                exit 1
              fi
            fi

            # PROXYIP / GO2SOCKS5 由上游读取并解释；这里仅拒绝空值。
            if [[ -n "${PROXYIP}" && "${PROXYIP}" =~ [[:space:]] ]]; then
              echo "❌ PROXYIP 不应包含空白字符。"
              exit 1
            fi

            if [[ -n "${GO2SOCKS5}" && "${GO2SOCKS5}" =~ [[:space:]] ]]; then
              echo "❌ GO2SOCKS5 不应包含空白字符；请使用逗号分隔域名。"
              exit 1
            fi
          }

          resolve_manual_optional_settings() {
            # PRELOAD_RACE_DIAL
            case "${INPUT_PRELOAD_RACE_DIAL}" in
              默认（不设置）|默认|"") PRELOAD_RACE_DIAL="" ;;
              启用（1）|1)  PRELOAD_RACE_DIAL="1" ;;
              *)          echo "❌ PRELOAD_RACE_DIAL 选择无效。"; exit 1 ;;
            esac

            # TCP_CONCURRENT_DIAL
            case "${INPUT_TCP_CONCURRENT_DIAL_MODE}" in
              默认（不设置）|默认|"")
                TCP_CONCURRENT_DIAL=""
                ;;
              自定义)
                validate_positive_integer "TCP_CONCURRENT_DIAL" "${INPUT_TCP_CONCURRENT_DIAL_VALUE}"
                TCP_CONCURRENT_DIAL="${INPUT_TCP_CONCURRENT_DIAL_VALUE}"
                ;;
              *)
                echo "❌ TCP_CONCURRENT_DIAL 模式无效。"
                exit 1
                ;;
            esac

            # PROXY_CONCURRENT_DIAL
            case "${INPUT_PROXY_CONCURRENT_DIAL_MODE}" in
              默认（不设置）|默认|"")
                PROXY_CONCURRENT_DIAL=""
                ;;
              自定义)
                validate_positive_integer "PROXY_CONCURRENT_DIAL" "${INPUT_PROXY_CONCURRENT_DIAL_VALUE}"
                PROXY_CONCURRENT_DIAL="${INPUT_PROXY_CONCURRENT_DIAL_VALUE}"
                ;;
              *)
                echo "❌ PROXY_CONCURRENT_DIAL 模式无效。"
                exit 1
                ;;
            esac

            # URL
            case "${INPUT_URL_MODE}" in
              默认（不设置）|默认|"")
                DEFAULT_URL=""
                ;;
              自定义)
                DEFAULT_URL="$(trim "${INPUT_URL_VALUE}")"
                if [[ -z "${DEFAULT_URL}" ]]; then
                  echo "❌ URL 选择“自定义”后必须填写值。"
                  exit 1
                fi
                ;;
              *)
                echo "❌ URL 模式无效。"
                exit 1
                ;;
            esac

            # PROXYIP
            case "${INPUT_PROXYIP_MODE}" in
              默认（不设置）|默认|"")
                PROXYIP=""
                ;;
              自定义)
                PROXYIP="$(trim "${INPUT_PROXYIP_VALUE}")"
                if [[ -z "${PROXYIP}" ]]; then
                  echo "❌ PROXYIP 选择“自定义”后必须填写值。"
                  exit 1
                fi
                ;;
              *)
                echo "❌ PROXYIP 模式无效。"
                exit 1
                ;;
            esac

            # GO2SOCKS5
            case "${INPUT_GO2SOCKS5_MODE}" in
              默认（不设置）|默认|"")
                GO2SOCKS5=""
                ;;
              自定义)
                GO2SOCKS5="$(trim "${INPUT_GO2SOCKS5_VALUE}")"
                if [[ -z "${GO2SOCKS5}" ]]; then
                  echo "❌ GO2SOCKS5 选择“自定义”后必须填写值。"
                  exit 1
                fi
                ;;
              *)
                echo "❌ GO2SOCKS5 模式无效。"
                exit 1
                ;;
            esac

            # DEBUG / OFF_LOG / BEST_SUB
            case "${INPUT_DEBUG}" in
              默认（不设置）|默认|"") DEBUG="" ;;
              启用（1）|1)  DEBUG="1" ;;
              *)          echo "❌ DEBUG 选择无效。"; exit 1 ;;
            esac

            case "${INPUT_OFF_LOG}" in
              默认（不设置）|默认|"") OFF_LOG="" ;;
              关闭日志（1）|1)  OFF_LOG="1" ;;
              *)          echo "❌ OFF_LOG 选择无效。"; exit 1 ;;
            esac

            case "${INPUT_BEST_SUB}" in
              默认（不设置）|默认|"") BEST_SUB="" ;;
              启用（1）|1)  BEST_SUB="1" ;;
              *)          echo "❌ BEST_SUB 选择无效。"; exit 1 ;;
            esac
          }

          save_manual_optional_settings() {
            local settings_dir
            local settings_tmp
            local settings_status

            settings_dir="$(dirname "${SETTINGS_FILE}")"
            settings_tmp="${SETTINGS_FILE}.tmp"
            mkdir -p "${settings_dir}"

            # 先同步到远端最新提交，避免把并发产生的其他仓库更新覆盖掉。
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin "${GITHUB_REF_NAME}" --quiet
            git reset --hard "origin/${GITHUB_REF_NAME}"

            optional_settings_json > "${settings_tmp}"
            mv "${settings_tmp}" "${SETTINGS_FILE}"

            settings_status="$(git status --porcelain=v1 -- "${SETTINGS_FILE}")"

            if [[ -z "${settings_status}" ]]; then
              echo "ℹ️ 手动选择与上次持久化配置相同，无需更新设置文件。"
              return 0
            fi

            git add "${SETTINGS_FILE}"
            git commit -m "chore: update EdgeTunnel deploy settings [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"

            # 推送成功后重新定位到远端最新提交，确保后续 domain.txt 操作从最新仓库状态继续。
            git fetch origin "${GITHUB_REF_NAME}" --quiet
            git reset --hard "origin/${GITHUB_REF_NAME}"

            echo "✅ 本次手动选择已持久化；后续自动部署将沿用这 9 个变量的状态。"
          }

          load_or_resolve_optional_settings() {
            if [[ "${IS_MANUAL}" == "true" ]]; then
              resolve_manual_optional_settings
              validate_optional_settings
              save_manual_optional_settings
            else
              load_persisted_optional_settings
              validate_optional_settings
            fi
          }

          trim() {
            local value="${1:-}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value}"
          }

          if [[ ! -x "${WRANGLER_BIN}" ]]; then
            echo "❌ Wrangler 未正确安装：${WRANGLER_BIN}"
            exit 1
          fi

          require_cmd() {
            command -v "$1" >/dev/null 2>&1 || {
              echo "❌ 缺少依赖：$1"
              exit 1
            }
          }

          require_cmd curl
          require_cmd jq
          require_cmd unzip
          require_cmd sha256sum
          require_cmd git

          load_or_resolve_optional_settings

          readonly ZIP_URL="https://github.com/${UPSTREAM_REPO}/archive/refs/heads/${UPSTREAM_BRANCH}.zip"

          echo "=================================================="
          echo "🚀 EdgeTunnel 批量自动部署"
          echo "=================================================="
          echo "📦 上游仓库：${UPSTREAM_REPO}"
          echo "🌿 上游分支：${UPSTREAM_BRANCH}"
          echo "🔗 ZIP：${ZIP_URL}"
          echo "🔐 ADMIN / UUID / KEY：仅从 GitHub Secrets 读取，不打印值"
          echo "⚙️ 可选变量状态："
          [[ -n "${PRELOAD_RACE_DIAL}" ]] && echo "   PRELOAD_RACE_DIAL=1" || echo "   PRELOAD_RACE_DIAL=默认"
          [[ -n "${TCP_CONCURRENT_DIAL}" ]] && echo "   TCP_CONCURRENT_DIAL=自定义（数值不打印）" || echo "   TCP_CONCURRENT_DIAL=默认"
          [[ -n "${PROXY_CONCURRENT_DIAL}" ]] && echo "   PROXY_CONCURRENT_DIAL=自定义（数值不打印）" || echo "   PROXY_CONCURRENT_DIAL=默认"
          [[ -n "${DEFAULT_URL}" ]] && echo "   URL=自定义（值不打印）" || echo "   URL=默认"
          [[ -n "${PROXYIP}" ]] && echo "   PROXYIP=自定义（值不打印）" || echo "   PROXYIP=默认"
          [[ -n "${GO2SOCKS5}" ]] && echo "   GO2SOCKS5=自定义（值不打印）" || echo "   GO2SOCKS5=默认"
          [[ -n "${DEBUG}" ]] && echo "   DEBUG=1" || echo "   DEBUG=默认"
          [[ -n "${OFF_LOG}" ]] && echo "   OFF_LOG=1" || echo "   OFF_LOG=默认"
          [[ -n "${BEST_SUB}" ]] && echo "   BEST_SUB=1" || echo "   BEST_SUB=默认"
          echo "📦 KV：${KV_NAME}"
          if [[ "${IS_MANUAL}" == "true" ]]; then
            echo "🖐️ 运行方式：手动执行（本次选择会保存）"
          else
            echo "⏱️ 运行方式：自动执行（沿用最近一次手动保存）"
          fi
          echo "🔐 ADMIN / UUID / KEY：仅从 GitHub Secrets 读取，不打印值"
          echo "⚙️ 9 个可选变量：默认状态不写入；其余状态不打印实际值"
          echo "=================================================="

          # ==========================================================
          # 临时目录
          # ==========================================================
          WORK_DIR="$(mktemp -d "${RUNNER_TEMP}/edgetunnel-deploy.XXXXXX")"
          trap 'rm -rf "${WORK_DIR}"' EXIT

          SOURCE_ZIP="${WORK_DIR}/source.zip"
          SOURCE_DIR="${WORK_DIR}/source"
          DOMAIN_NEXT="${WORK_DIR}/domain.next.txt"

          mkdir -p "${SOURCE_DIR}"

          # ==========================================================
          # 下载并校验上游代码
          # ==========================================================
          echo "⬇️ 正在下载 ${UPSTREAM_BRANCH}..."

          curl -fsSL \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 2 \
            -o "${SOURCE_ZIP}" \
            "${ZIP_URL}"

          unzip -tq "${SOURCE_ZIP}"
          unzip -q "${SOURCE_ZIP}" -d "${SOURCE_DIR}"

          PAYLOAD_DIR="$(
            find "${SOURCE_DIR}" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print -quit
          )"

          if [[ -z "${PAYLOAD_DIR}" || ! -d "${PAYLOAD_DIR}" ]]; then
            echo "❌ ZIP 结构异常，无法找到项目目录。"
            exit 1
          fi

          if [[ ! -f "${PAYLOAD_DIR}/_worker.js" ]]; then
            echo "❌ ${UPSTREAM_BRANCH} 中没有找到 _worker.js。"
            echo "❌ 为防止部署错误版本，本次任务终止。"
            exit 1
          fi

          # 上游 Wrangler 配置不直接继承；每个项目使用本 workflow 生成的完整配置。
          rm -f \
            "${PAYLOAD_DIR}/wrangler.toml" \
            "${PAYLOAD_DIR}/wrangler.json" \
            "${PAYLOAD_DIR}/wrangler.jsonc"

          SOURCE_SHA="$(sha256sum "${SOURCE_ZIP}" | awk '{print $1}')"
          readonly COMPATIBILITY_DATE="$(date -u -d '1 day ago' +%Y-%m-%d)"

          echo "🗓️ Compatibility Date：${COMPATIBILITY_DATE}"
          echo "🔐 ZIP SHA256：${SOURCE_SHA}"

          if UPSTREAM_SHA="$(
            curl -fsSL \
              --retry 3 \
              --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "User-Agent: github-actions-edgetunnel-deployer" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/commits/${UPSTREAM_BRANCH}" |
            jq -r '.sha // empty'
          )"; then
            echo "🔖 ${UPSTREAM_BRANCH} 当前提交：${UPSTREAM_SHA}"
          else
            echo "⚠️ 无法获取 GitHub 当前 commit SHA，继续部署。"
          fi

          # ==========================================================
          # 解析 CF_ACCOUNTS
          #
          # 支持：
          #   ACCOUNT_ID:API_TOKEN
          #   ACCOUNT_ID:GLOBAL_API_KEY:EMAIL
          # ==========================================================
          declare -a ACCOUNT_IDS=()
          declare -a CREDENTIALS=()
          declare -a AUTH_TYPES=()
          declare -a AUTH_EMAILS=()

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value}"
          }

          while IFS= read -r raw_line || [[ -n "${raw_line}" ]]; do
            line="$(trim "${raw_line}")"

            [[ -z "${line}" ]] && continue
            [[ "${line}" =~ ^# ]] && continue

            account_id=""
            credential=""
            email=""
            extra=""

            IFS=':' read -r account_id credential email extra <<< "${line}"

            account_id="$(trim "${account_id}")"
            credential="$(trim "${credential}")"
            email="$(trim "${email}")"
            extra="$(trim "${extra}")"

            if [[ -n "${extra}" ]]; then
              echo "❌ CF_ACCOUNTS 格式错误：该行包含过多冒号。"
              echo "   支持：ACCOUNT_ID:API_TOKEN"
              echo "   或：ACCOUNT_ID:GLOBAL_API_KEY:EMAIL"
              exit 1
            fi

            if [[ -z "${email}" ]]; then
              auth_type="api_token"
            else
              auth_type="global_key"
            fi

            if [[ ! "${account_id}" =~ ^[A-Fa-f0-9]{32}$ ]]; then
              echo "❌ 无效 Account ID：${account_id}"
              exit 1
            fi

            if [[ -z "${credential}" ]]; then
              echo "❌ Account ${account_id} 的凭证为空。"
              exit 1
            fi

            if [[ "${auth_type}" == "global_key" &&
                  ! "${email}" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
              echo "❌ Account ${account_id} 的 Global API Key 邮箱格式无效。"
              exit 1
            fi

            ACCOUNT_IDS+=("${account_id}")
            CREDENTIALS+=("${credential}")
            AUTH_TYPES+=("${auth_type}")
            AUTH_EMAILS+=("${email}")
          done <<< "${CF_ACCOUNTS}"

          readonly ACCOUNT_COUNT="${#ACCOUNT_IDS[@]}"

          if (( ACCOUNT_COUNT == 0 )); then
            echo "❌ CF_ACCOUNTS 没有有效账号。"
            exit 1
          fi

          echo "📦 共检测到 ${ACCOUNT_COUNT} 个 Cloudflare 账号。"

          # ==========================================================
          # UUID 配置
          #
          # 保持原脚本的 UUID Secret 语义，不在本次改动中重构：
          # UUID_CONFIG 格式：项目序号:UUIDv4
          # - 指定的“UUID 提供项目”写 ADMIN、不写 UUID；
          # - 其他项目写固定 UUID、不写 ADMIN；
          # - 未配置 UUID Secret 时，保持原脚本的独立项目行为。
          #
          # UUID 的真实值只来自 GitHub Secret，日志不打印其内容。
          # ==========================================================
          UUID_SOURCE_INDEX=""
          SHARED_UUID=""
          UUID_VALID=false

          if [[ -n "${UUID_CONFIG}" ]]; then
            if [[ "${UUID_CONFIG}" =~ ^([1-9][0-9]*):([[:xdigit:]]{8}-[[:xdigit:]]{4}-4[[:xdigit:]]{3}-[89abAB][[:xdigit:]]{3}-[[:xdigit:]]{12})$ ]]; then
              UUID_SOURCE_INDEX="${BASH_REMATCH[1]}"
              SHARED_UUID="${BASH_REMATCH[2]}"

              if (( UUID_SOURCE_INDEX >= 1 && UUID_SOURCE_INDEX <= ACCOUNT_COUNT )); then
                UUID_VALID=true
                echo "🧩 UUID 提供项目：${UUID_SOURCE_INDEX}"
                echo "   其他项目将统一使用 UUID Secret 提供的固定 UUID。"
              else
                echo "❌ UUID 项目序号 ${UUID_SOURCE_INDEX} 超出当前账号数量 1..${ACCOUNT_COUNT}。"
                exit 1
              fi
            else
              echo "❌ UUID Secret 格式无效。"
              echo "❌ 正确格式：项目序号:UUIDv4"
              echo "❌ 示例：1:UUIDv4 示例（请勿填写真实密钥）"
              exit 1
            fi
          else
            echo "ℹ️ 未配置 UUID 聚合：所有项目都不写 UUID。"
          fi

          # ==========================================================
          # Cloudflare API
          # GET 使用重试；POST 不使用自动重试，避免非幂等创建重复资源。
          # ==========================================================
          api_request() {
            local index="$1"
            local method="$2"
            local url="$3"
            local data="${4:-}"

            local -a headers=("-H" "Content-Type: application/json")

            if [[ "${AUTH_TYPES[$index]}" == "global_key" ]]; then
              headers+=(
                "-H" "X-Auth-Email: ${AUTH_EMAILS[$index]}"
                "-H" "X-Auth-Key: ${CREDENTIALS[$index]}"
              )
            else
              headers+=("-H" "Authorization: Bearer ${CREDENTIALS[$index]}")
            fi

            if [[ "${method}" == "GET" ]]; then
              curl -fsSL \
                --retry 4 \
                --retry-all-errors \
                --retry-delay 2 \
                "${headers[@]}" \
                "${url}"
              return
            fi

            if [[ -n "${data}" ]]; then
              curl -fsSL \
                -X "${method}" \
                "${headers[@]}" \
                --data "${data}" \
                "${url}"
            else
              curl -fsSL \
                -X "${method}" \
                "${headers[@]}" \
                "${url}"
            fi
          }

          api_get() {
            api_request "$1" GET "$2"
          }

          api_post() {
            api_request "$1" POST "$2" "$3"
          }

          # GET 项目时需要区分 200 / 404 / 其他 HTTP 错误。
          # 只有 404 才允许进入“创建 Pages 项目”流程。
          api_get_status() {
            local index="$1"
            local url="$2"
            local body_file="$3"

            local -a headers=("-H" "Content-Type: application/json")

            if [[ "${AUTH_TYPES[$index]}" == "global_key" ]]; then
              headers+=(
                "-H" "X-Auth-Email: ${AUTH_EMAILS[$index]}"
                "-H" "X-Auth-Key: ${CREDENTIALS[$index]}"
              )
            else
              headers+=("-H" "Authorization: Bearer ${CREDENTIALS[$index]}")
            fi

            curl -sS \
              --retry 4 \
              --retry-all-errors \
              --retry-delay 2 \
              "${headers[@]}" \
              -o "${body_file}" \
              -w '%{http_code}' \
              "${url}"
          }

          # ==========================================================
          # 生成完整 Wrangler 配置
          #
          # Wrangler vars 对应 Pages 生产环境的明文环境变量；
          # 按用户要求，ADMIN / UUID / KEY 也写入 vars，而不是 secret_text。
          # 它们只在 Runner 临时目录生成，绝不写入仓库。
          # ==========================================================
          write_wrangler_config() {
            local project_name="$1"
            local kv_id="$2"
            local shared_uuid="${3:-}"
            local include_admin="$4"
            local config_file="${PAYLOAD_DIR}/wrangler.json"

            jq -n \
              --arg name "${project_name}" \
              --arg compatibility_date "${COMPATIBILITY_DATE}" \
              --arg admin "${ADMIN_PASS}" \
              --arg key "${KEY_PASS}" \
              --arg uuid "${shared_uuid}" \
              --arg include_admin "${include_admin}" \
              --arg url "${DEFAULT_URL}" \
              --arg proxyip "${PROXYIP}" \
              --arg socks5 "${GO2SOCKS5}" \
              --arg debug "${DEBUG}" \
              --arg off_log "${OFF_LOG}" \
              --arg best_sub "${BEST_SUB}" \
              --arg preload "${PRELOAD_RACE_DIAL}" \
              --arg tcp "${TCP_CONCURRENT_DIAL}" \
              --arg proxy "${PROXY_CONCURRENT_DIAL}" \
              --arg kv_id "${kv_id}" \
              '{
                name: $name,
                pages_build_output_dir: ".",
                compatibility_date: $compatibility_date,
                vars: (
                  {}
                  + (if $include_admin == "true" then {ADMIN: $admin} else {} end)
                  + (if $key != "" then {KEY: $key} else {} end)
                  + (if $uuid != "" then {UUID: $uuid} else {} end)
                  + (if $url != "" then {URL: $url} else {} end)
                  + (if $proxyip != "" then {PROXYIP: $proxyip} else {} end)
                  + (if $socks5 != "" then {GO2SOCKS5: $socks5} else {} end)
                  + (if $debug != "" then {DEBUG: $debug} else {} end)
                  + (if $off_log != "" then {OFF_LOG: $off_log} else {} end)
                  + (if $best_sub != "" then {BEST_SUB: $best_sub} else {} end)
                  + (if $preload != "" then {PRELOAD_RACE_DIAL: $preload} else {} end)
                  + (if $tcp != "" then {TCP_CONCURRENT_DIAL: $tcp} else {} end)
                  + (if $proxy != "" then {PROXY_CONCURRENT_DIAL: $proxy} else {} end)
                ),
                kv_namespaces: [
                  {binding: "KV", id: $kv_id}
                ]
              }' > "${config_file}"

            jq empty "${config_file}"

            echo "📄 Wrangler 配置已生成：敏感变量只在 Runner 临时文件中使用。"
            echo "   ADMIN：$([[ "${include_admin}" == "true" ]] && echo "写入" || echo "不写入")"
            echo "   UUID：$([[ -n "${shared_uuid}" ]] && echo "写入" || echo "不写入")"
            echo "   KEY：$([[ -n "${KEY_PASS}" ]] && echo "写入" || echo "不写入")"
            echo "   其余 9 个变量按本次持久化选择写入；实际值不打印。"
          }

          # ==========================================================
          # Pages 部署
          # ==========================================================
          run_pages_deploy() {
            local index="$1"
            local account_id="${ACCOUNT_IDS[$index]}"
            local project_name="$((index + 1))"

            if [[ "${AUTH_TYPES[$index]}" == "api_token" ]]; then
              env \
                -u CLOUDFLARE_API_KEY \
                -u CLOUDFLARE_EMAIL \
                CLOUDFLARE_ACCOUNT_ID="${account_id}" \
                CLOUDFLARE_API_TOKEN="${CREDENTIALS[$index]}" \
                "${WRANGLER_BIN}" pages deploy . \
                  --project-name="${project_name}" \
                  --branch="${PAGES_PRODUCTION_BRANCH}" \
                  --commit-dirty=true
            else
              env \
                -u CLOUDFLARE_API_TOKEN \
                CLOUDFLARE_ACCOUNT_ID="${account_id}" \
                CLOUDFLARE_API_KEY="${CREDENTIALS[$index]}" \
                CLOUDFLARE_EMAIL="${AUTH_EMAILS[$index]}" \
                "${WRANGLER_BIN}" pages deploy . \
                  --project-name="${project_name}" \
                  --branch="${PAGES_PRODUCTION_BRANCH}" \
                  --commit-dirty=true
            fi
          }

          # ==========================================================
          # 获取 Pages 自定义域
          # active 的非 pages.dev 自定义域优先，否则 pages.dev。
          # ==========================================================
          get_preferred_domain() {
            local index="$1"
            local project_name="$2"
            local project_json="$3"
            local domains_json=""
            local custom_domain=""
            local pages_subdomain=""

            pages_subdomain="$(jq -r '.result.subdomain // empty' <<< "${project_json}")"

            if domains_json="$(
              api_get \
                "${index}" \
                "${API_BASE}/accounts/${ACCOUNT_IDS[$index]}/pages/projects/${project_name}/domains"
            )"; then
              custom_domain="$(
                jq -r '
                  [
                    .result[]?
                    | select(
                        (.name // "") != ""
                        and ((.name | ascii_downcase) | endswith(".pages.dev") | not)
                        and (.status == "active")
                      )
                  ]
                  | sort_by(.name)
                  | .[0].name // empty
                ' <<< "${domains_json}"
              )"
            else
              echo "⚠️ 无法读取 Pages 自定义域列表，将使用 pages.dev。" >&2
            fi

            if [[ -n "${custom_domain}" ]]; then
              printf '%s\n' "${custom_domain}"
            else
              printf '%s\n' "${pages_subdomain}"
            fi
          }

          # ==========================================================
          # 配置验证
          #
          # 验证 Cloudflare Pages API 返回的 production env_vars：
          # - 应写入的变量：存在、类型为 plain_text、值与预期一致；
          # - default 状态的 9 个变量：必须不存在；
          # - ADMIN / UUID 保持现有聚合逻辑；
          # - KEY 若 Secret 存在，则所有项目写入。
          # ==========================================================
          verify_production_config() {
            local project_json="$1"
            local expect_admin="$2"
            local expect_uuid="$3"
            local expect_kv="$4"

            jq -e \
              --arg admin "${ADMIN_PASS}" \
              --arg key "${KEY_PASS}" \
              --arg expect_admin "${expect_admin}" \
              --arg expect_uuid "${expect_uuid}" \
              --arg kv_id "${expect_kv}" \
              --arg url "${DEFAULT_URL}" \
              --arg proxyip "${PROXYIP}" \
              --arg socks5 "${GO2SOCKS5}" \
              --arg debug "${DEBUG}" \
              --arg off_log "${OFF_LOG}" \
              --arg best_sub "${BEST_SUB}" \
              --arg preload "${PRELOAD_RACE_DIAL}" \
              --arg tcp "${TCP_CONCURRENT_DIAL}" \
              --arg proxy "${PROXY_CONCURRENT_DIAL}" \
              '.success == true
               and (.result.deployment_configs.production.env_vars // {} | type) == "object"
               and (.result.deployment_configs.production.kv_namespaces.KV.namespace_id // "") == $kv_id
               and (
                 ($expect_admin == "true"
                   and (.result.deployment_configs.production.env_vars.ADMIN.type // "") == "plain_text"
                   and (.result.deployment_configs.production.env_vars.ADMIN.value // "") == $admin)
                 or
                 ($expect_admin != "true"
                   and (.result.deployment_configs.production.env_vars | has("ADMIN") | not))
               )
               and (
                 ($expect_uuid != ""
                   and (.result.deployment_configs.production.env_vars.UUID.type // "") == "plain_text"
                   and (.result.deployment_configs.production.env_vars.UUID.value // "") == $expect_uuid)
                 or
                 ($expect_uuid == ""
                   and (.result.deployment_configs.production.env_vars | has("UUID") | not))
               )
               and (
                 ($key != ""
                   and (.result.deployment_configs.production.env_vars.KEY.type // "") == "plain_text"
                   and (.result.deployment_configs.production.env_vars.KEY.value // "") == $key)
                 or
                 ($key == ""
                   and (.result.deployment_configs.production.env_vars | has("KEY") | not))
               )
               and (
                 ($url != ""
                   and (.result.deployment_configs.production.env_vars.URL.type // "") == "plain_text"
                   and (.result.deployment_configs.production.env_vars.URL.value // "") == $url)
                 or
                 ($url == ""
                   and (.result.deployment_configs.production.env_vars | has("URL") | not))
               )
               and (
                 ($proxyip != ""
                   and (.result.deployment_configs.production.env_vars.PROXYIP.type // "") == "plain_text"
                   and (.result.deployment_configs.production.env_vars.PROXYIP.value // "") == $proxyip)
                 or
                 ($proxyip == ""
                   and (.result.deployment_configs.production.env_vars | has("PROXYIP") | not))
               )
               and (
                 ($socks5 != ""
                   and (.result.deployment_configs.production.env_vars.GO2SOCKS5.type // "") == "plain_text"
                   and (.result.deployment_configs.production.env_vars.GO2SOCKS5.value // "") == $socks5)
                 or
                 ($socks5 == ""
                   and (.result.deployment_configs.production.env_vars | has("GO2SOCKS5") | not))
               )
               and (
                 ($debug != ""
                   and (.result.deployment_configs.production.env_vars.DEBUG.type // "") == "plain_text"
                   and (.result.deployment_configs.production.env_vars.DEBUG.value // "") == $debug)
                 or
                 ($debug == ""
                   and (.result.deployment_configs.production.env_vars | has("DEBUG") | not))
               )
               and (
                 ($off_log != ""
                   and (.result.deployment_configs.production.env_vars.OFF_LOG.type // "") == "plain_text"
                   and (.result.deployment_configs.production.env_vars.OFF_LOG.value // "") == $off_log)
                 or
                 ($off_log == ""
                   and (.result.deployment_configs.production.env_vars | has("OFF_LOG") | not))
               )
               and (
                 ($best_sub != ""
                   and (.result.deployment_configs.production.env_vars.BEST_SUB.type // "") == "plain_text"
                   and (.result.deployment_configs.production.env_vars.BEST_SUB.value // "") == $best_sub)
                 or
                 ($best_sub == ""
                   and (.result.deployment_configs.production.env_vars | has("BEST_SUB") | not))
               )
               and (
                 ($preload != ""
                   and (.result.deployment_configs.production.env_vars.PRELOAD_RACE_DIAL.type // "") == "plain_text"
                   and (.result.deployment_configs.production.env_vars.PRELOAD_RACE_DIAL.value // "") == $preload)
                 or
                 ($preload == ""
                   and (.result.deployment_configs.production.env_vars | has("PRELOAD_RACE_DIAL") | not))
               )
               and (
                 ($tcp != ""
                   and (.result.deployment_configs.production.env_vars.TCP_CONCURRENT_DIAL.type // "") == "plain_text"
                   and (.result.deployment_configs.production.env_vars.TCP_CONCURRENT_DIAL.value // "") == $tcp)
                 or
                 ($tcp == ""
                   and (.result.deployment_configs.production.env_vars | has("TCP_CONCURRENT_DIAL") | not))
               )
               and (
                 ($proxy != ""
                   and (.result.deployment_configs.production.env_vars.PROXY_CONCURRENT_DIAL.type // "") == "plain_text"
                   and (.result.deployment_configs.production.env_vars.PROXY_CONCURRENT_DIAL.value // "") == $proxy)
                 or
                 ($proxy == ""
                   and (.result.deployment_configs.production.env_vars | has("PROXY_CONCURRENT_DIAL") | not))
               )' \
              >/dev/null <<< "${project_json}"
          }

          print_config_summary() {
            local project_json="$1"

            echo "🔎 Cloudflare 实际生产配置摘要（不输出敏感值）："
            jq -c '
              {
                success,
                env_var_keys: (.result.deployment_configs.production.env_vars // {} | keys),
                kv_namespaces: (.result.deployment_configs.production.kv_namespaces // {}),
                wrangler_config_hash: (.result.wrangler_config_hash // null),
                errors,
                messages
              }
            ' <<< "${project_json}" 2>/dev/null || true
          }

          # ==========================================================
          # 结果数组
          # ==========================================================
          declare -a ADMIN_DOMAINS=()
          declare -a HOST_DOMAINS=()
          declare -a FAILED_PROJECTS=()

          DEPLOYED_COUNT=0

          # ==========================================================
          # 部署单个账号
          # ==========================================================
          deploy_one() {
            local index="$1"
            local account_id="${ACCOUNT_IDS[$index]}"
            local project_name="$((index + 1))"

            local project_resp=""
            local create_resp=""
            local kv_list=""
            local kv_id=""
            local host=""
            local final_url=""
            local deploy_uuid=""
            local include_admin="false"
            local expected_admin="false"

            echo ""
            echo "=================================================="
            echo "🚀 第 ${project_name} 个账号"
            echo "   Account ID: ${account_id}"
            echo "   Pages 项目: ${project_name}"
            echo "=================================================="

            if [[ "${UUID_VALID}" == true && "${project_name}" == "${UUID_SOURCE_INDEX}" ]]; then
              include_admin="true"
              expected_admin="true"
            elif [[ "${UUID_VALID}" == true ]]; then
              include_admin="false"
            else
              # 没有 UUID 聚合时，为兼容原有独立面板工作方式，所有项目都保留 ADMIN。
              include_admin="true"
              expected_admin="true"
            fi

            if [[ "${UUID_VALID}" == true && "${project_name}" != "${UUID_SOURCE_INDEX}" ]]; then
              deploy_uuid="${SHARED_UUID}"
            else
              deploy_uuid=""
            fi

            if [[ "${UUID_VALID}" == true ]]; then
              if [[ "${project_name}" == "${UUID_SOURCE_INDEX}" ]]; then
                echo "🧩 角色：UUID 提供项目"
                echo "   ✅ 写入 ADMIN"
                echo "   ✅ 不写 UUID"
              else
                echo "🧩 角色：UUID 聚合节点"
                echo "   ✅ 写入固定 UUID（值不打印）"
                echo "   ✅ 不写 ADMIN"
              fi
            else
              echo "🧩 角色：独立项目（未启用 UUID 聚合）"
              echo "   ✅ 写入 ADMIN"
            fi

            if [[ -n "${KEY_PASS}" ]]; then
              echo "   ✅ KEY：写入（Secret 值不打印）"
            else
              echo "   ℹ️ KEY：未配置"
            fi

            # ----------------------------------------------------------
            # 1. 检查 / 创建 Pages 项目
            # ----------------------------------------------------------
            local project_body="${WORK_DIR}/project-${index}.json"
            local project_http_status=""

            if ! project_http_status="$(
              api_get_status \
                "${index}" \
                "${API_BASE}/accounts/${account_id}/pages/projects/${project_name}" \
                "${project_body}"
            )"; then
              echo "❌ 无法读取 Pages 项目 ${project_name}。"
              return 1
            fi

            case "${project_http_status}" in
              200)
                project_resp="$(cat "${project_body}")"
                if jq -e '.success == true and (.result.name // "") != ""' >/dev/null <<< "${project_resp}"; then
                  echo "✅ Pages 项目已存在。"
                else
                  echo "❌ Pages 项目 API 返回异常："
                  jq -c '{success,errors,messages}' <<< "${project_resp}" 2>/dev/null || true
                  return 1
                fi
                ;;

              404)
                echo "📁 Pages 项目不存在，正在创建..."

                create_resp="$(
                  api_post \
                    "${index}" \
                    "${API_BASE}/accounts/${account_id}/pages/projects" \
                    "$(jq -nc --arg name "${project_name}" --arg branch "${PAGES_PRODUCTION_BRANCH}" '{name:$name,production_branch:$branch}')"
                )" || {
                  echo "❌ 创建 Pages 项目请求失败。"
                  return 1
                }

                if ! jq -e '.success == true and (.result.name // "") != ""' >/dev/null <<< "${create_resp}"; then
                  echo "❌ 创建 Pages 项目失败："
                  jq -c '{success,errors,messages}' <<< "${create_resp}" 2>/dev/null || true
                  return 1
                fi

                project_resp="${create_resp}"
                echo "✅ Pages 项目创建成功。"
                ;;

              401|403)
                echo "❌ Cloudflare API 认证/权限错误（HTTP ${project_http_status}），不会创建 Pages 项目。"
                cat "${project_body}" | jq -c '{success,errors,messages}' 2>/dev/null || cat "${project_body}" || true
                return 1
                ;;

              429)
                echo "❌ Cloudflare API 限流（HTTP 429），不会把它误判成项目不存在。"
                cat "${project_body}" | jq -c '{success,errors,messages}' 2>/dev/null || cat "${project_body}" || true
                return 1
                ;;

              500|502|503|504)
                echo "❌ Cloudflare API 服务端错误（HTTP ${project_http_status}），不会创建 Pages 项目。"
                cat "${project_body}" | jq -c '{success,errors,messages}' 2>/dev/null || cat "${project_body}" || true
                return 1
                ;;

              *)
                echo "❌ 读取 Pages 项目返回未处理的 HTTP 状态：${project_http_status}"
                cat "${project_body}" | jq -c '{success,errors,messages}' 2>/dev/null || cat "${project_body}" || true
                return 1
                ;;
            esac

            # ----------------------------------------------------------
            # 2. 检查 / 创建 KV
            # ----------------------------------------------------------
            echo "📦 检查 KV：${KV_NAME}"

            if ! kv_list="$(
              api_get \
                "${index}" \
                "${API_BASE}/accounts/${account_id}/storage/kv/namespaces"
            )"; then
              echo "❌ 无法读取 KV 列表。"
              return 1
            fi

            if ! jq -e '.success == true and (.result | type == "array")' >/dev/null <<< "${kv_list}"; then
              echo "❌ KV API 返回异常："
              jq -c '{success,errors,messages}' <<< "${kv_list}" 2>/dev/null || true
              return 1
            fi

            kv_id="$(
              jq -r \
                --arg title "${KV_NAME}" \
                '.result[] | select(.title == $title) | .id' \
                <<< "${kv_list}" |
              head -n 1
            )"

            if [[ -z "${kv_id}" || "${kv_id}" == "null" ]]; then
              echo "📦 未找到 '${KV_NAME}'，正在创建..."

              create_resp="$(
                api_post \
                  "${index}" \
                  "${API_BASE}/accounts/${account_id}/storage/kv/namespaces" \
                  "$(jq -nc --arg title "${KV_NAME}" '{title:$title}')"
              )"

              if ! jq -e '.success == true and (.result.id // "") != ""' >/dev/null <<< "${create_resp}"; then
                echo "❌ 创建 KV 失败："
                jq -c '{success,errors,messages}' <<< "${create_resp}" 2>/dev/null || true
                return 1
              fi

              kv_id="$(jq -r '.result.id' <<< "${create_resp}")"
              echo "✅ KV 创建成功。"
            else
              echo "✅ 已存在所需 KV。"
            fi

            # ----------------------------------------------------------
            # 3. 生成完整 Wrangler 配置
            # ----------------------------------------------------------
            write_wrangler_config \
              "${project_name}" \
              "${kv_id}" \
              "${deploy_uuid}" \
              "${include_admin}"

            # ----------------------------------------------------------
            # 4. 部署；仅在 Wrangler 本身失败时重试一次
            # ----------------------------------------------------------
            echo "🌐 正在部署 Pages 项目 ${project_name}..."

            if ! (
              cd "${PAYLOAD_DIR}"
              run_pages_deploy "${index}"
            ); then
              echo "⚠️ 第 ${project_name} 个项目首次部署失败，重试一次..."

              if ! (
                cd "${PAYLOAD_DIR}"
                run_pages_deploy "${index}"
              ); then
                echo "❌ 第 ${project_name} 个项目部署失败。"
                return 1
              fi
            fi

            # ----------------------------------------------------------
            # 5. 部署后读取并严格验证实际生产配置
            # ----------------------------------------------------------
            project_resp="$(
              api_get \
                "${index}" \
                "${API_BASE}/accounts/${account_id}/pages/projects/${project_name}"
            )" || {
              echo "❌ 部署成功后无法读取 Pages 项目。"
              return 1
            }

            if ! verify_production_config \
              "${project_resp}" \
              "${expected_admin}" \
              "${deploy_uuid}" \
              "${kv_id}"; then
              echo "❌ 部署后生产配置验证失败。"
              echo "❌ 本次不再使用 API PATCH 强行覆盖，也不循环部署。"
              print_config_summary "${project_resp}"
              return 1
            fi

            echo "✅ Pages 环境变量已验证：敏感变量（ADMIN / UUID / KEY）与全部 9 个可选变量的实际存在性/值/明文类型。"

            echo "✅ Pages KV 绑定已验证。"

            # ----------------------------------------------------------
            # 6. 获取最终域名
            # ----------------------------------------------------------
            host=""

            for attempt in 1 2 3 4 5; do
              host="$(get_preferred_domain "${index}" "${project_name}" "${project_resp}" || true)"
              host="$(trim "${host}")"

              if [[ -n "${host}" ]]; then
                break
              fi

              if (( attempt < 5 )); then
                echo "⏳ 获取最终域名第 ${attempt}/5 次失败，等待 2 秒..."
                sleep 2
                project_resp="$(
                  api_get \
                    "${index}" \
                    "${API_BASE}/accounts/${account_id}/pages/projects/${project_name}" \
                    || true
                )"
              fi
            done

            if [[ -z "${host}" ]]; then
              echo "❌ 部署成功，但没有获取到可用域名。"
              return 1
            fi

            host="${host#https://}"
            host="${host#http://}"
            host="${host%%/*}"
            host="${host%.}"

            if [[ -z "${host}" ]]; then
              echo "❌ 域名清理后为空。"
              return 1
            fi

            final_url="https://${host}/admin"

            echo "🔗 管理地址：${final_url}"
            echo "🌐 Host：${host}"

            ADMIN_DOMAINS[$index]="${final_url}"
            HOST_DOMAINS[$index]="${host}"

            DEPLOYED_COUNT=$((DEPLOYED_COUNT + 1))

            echo "🎉 第 ${project_name} 个项目处理完成。"
          }

          # ==========================================================
          # 逐账号部署
          # ==========================================================
          for ((i=0; i<ACCOUNT_COUNT; i++)); do
            if ! deploy_one "${i}"; then
              FAILED_PROJECTS+=("$((i + 1))")
            fi
          done

          # ==========================================================
          # 同步最新远端仓库状态（包含刚刚保存的持久化配置）
          # ==========================================================
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${GITHUB_REF_NAME}" --quiet
          git reset --hard "origin/${GITHUB_REF_NAME}"

          # ==========================================================
          # 读取旧 domain.txt
          # ==========================================================
          declare -a OLD_ADMIN_DOMAINS=()
          declare -a OLD_HOST_DOMAINS=()

          if [[ -f domain.txt ]]; then
            section="admin"

            while IFS= read -r old_domain || [[ -n "${old_domain}" ]]; do
              old_domain="${old_domain%$'\r'}"

              if [[ -z "${old_domain}" ]]; then
                section="host"
                continue
              fi

              if [[ "${section}" == "admin" ]]; then
                OLD_ADMIN_DOMAINS+=("${old_domain}")
              else
                OLD_HOST_DOMAINS+=("${old_domain}")
              fi
            done < domain.txt

            if (( ${#OLD_HOST_DOMAINS[@]} == 0 && ${#OLD_ADMIN_DOMAINS[@]} > 0 )); then
              for old_domain in "${OLD_ADMIN_DOMAINS[@]}"; do
                if [[ "${old_domain}" =~ ^https?://([^/]+)/admin/?$ ]]; then
                  OLD_HOST_DOMAINS+=("${BASH_REMATCH[1]}")
                else
                  OLD_HOST_DOMAINS+=("")
                fi
              done
            fi
          fi

          # 失败项目仅保留旧值用于日志展示；只要有失败，最终不提交 domain.txt。
          for ((i=0; i<ACCOUNT_COUNT; i++)); do
            if [[ -z "${ADMIN_DOMAINS[$i]:-}" && -n "${OLD_ADMIN_DOMAINS[$i]:-}" ]]; then
              ADMIN_DOMAINS[$i]="${OLD_ADMIN_DOMAINS[$i]}"
            fi

            if [[ -z "${HOST_DOMAINS[$i]:-}" && -n "${OLD_HOST_DOMAINS[$i]:-}" ]]; then
              HOST_DOMAINS[$i]="${OLD_HOST_DOMAINS[$i]}"
            fi
          done

          # ==========================================================
          # 生成 domain.txt
          # ==========================================================
          if (( ${#FAILED_PROJECTS[@]} == 0 )); then
            : > "${DOMAIN_NEXT}"

            for ((i=0; i<ACCOUNT_COUNT; i++)); do
              printf '%s\n' "${ADMIN_DOMAINS[$i]}" >> "${DOMAIN_NEXT}"
            done

            printf '\n' >> "${DOMAIN_NEXT}"

            for ((i=0; i<ACCOUNT_COUNT; i++)); do
              printf '%s\n' "${HOST_DOMAINS[$i]}" >> "${DOMAIN_NEXT}"
            done
          else
            echo "⚠️ 检测到失败项目，本次不更新 domain.txt，避免列表与项目序号错位。"
            rm -f "${DOMAIN_NEXT}"
          fi

          # ==========================================================
          # 输出与提交
          # ==========================================================
          echo ""
          echo "┌────┬─────────────────────────────────────────────────────┐"
          echo "│ ID │ 最终管理地址                                        │"
          echo "├────┼─────────────────────────────────────────────────────┤"
          for ((i=0; i<ACCOUNT_COUNT; i++)); do
            printf '│ %2d │ %-51s │\n' "$((i + 1))" "${ADMIN_DOMAINS[$i]:-失败/无域名}"
          done
          echo "└────┴─────────────────────────────────────────────────────┘"

          if (( ${#FAILED_PROJECTS[@]} == 0 )); then
            echo ""
            echo "================ domain.txt ================"
            cat "${DOMAIN_NEXT}"
            echo "============================================="

            if [[ -f domain.txt ]] && cmp -s "${DOMAIN_NEXT}" domain.txt; then
              echo "✨ domain.txt 内容无变化，跳过 Commit。"
              rm -f "${DOMAIN_NEXT}"
            else
              mv "${DOMAIN_NEXT}" domain.txt
              git add domain.txt
              git commit -m "chore: auto update deployed domains list [skip ci]"
              git fetch origin "${GITHUB_REF_NAME}" --quiet
              git rebase "origin/${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
              echo "✅ domain.txt 已推送到 GitHub。"
            fi
          fi

          if (( ${#FAILED_PROJECTS[@]} > 0 )); then
            echo ""
            echo "❌ 以下项目本次未完整完成：${FAILED_PROJECTS[*]}"
            echo "ℹ️ 已成功部署：${DEPLOYED_COUNT}/${ACCOUNT_COUNT}"
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "🎉 全部 ${ACCOUNT_COUNT} 个项目部署完成！"
          echo "=================================================="
