name: 批量自动部署至 Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - domain.txt
  schedule:
    # 台湾时间每天 08:00
    - cron: "0 8 * * *"
      timezone: "Asia/Taipei"
    # 台湾时间每天 19:00
    - cron: "0 19 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch-deploy
  cancel-in-progress: false

jobs:
  batch-deploy:
    name: Batch Deploy & Update Domain List
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          check-latest: true
          package-manager-cache: false

      - name: Install Latest Wrangler
        shell: bash
        run: |
          set -euo pipefail

          WRANGLER_HOME="${RUNNER_TEMP}/wrangler"
          mkdir -p "${WRANGLER_HOME}"

          npm install \
            --prefix "${WRANGLER_HOME}" \
            --no-save \
            --no-package-lock \
            wrangler@latest

          "${WRANGLER_HOME}/node_modules/.bin/wrangler" --version

      - name: Download EdgeTunnel and Batch Deploy
        shell: bash
        env:
          CF_ACCOUNTS: ${{ secrets.CF_ACCOUNTS }}
          ADMIN_PASS: ${{ secrets.ADMIN }}
          UUID_CONFIG: ${{ secrets.UUID }}
          GITHUB_TOKEN: ${{ github.token }}
          WRANGLER_BIN: ${{ runner.temp }}/wrangler/node_modules/.bin/wrangler
        run: |
          set -euo pipefail

          # ==========================================================
          # 【可修改配置区】
          # ==========================================================
          readonly UPSTREAM_REPO="cmliu/edgetunnel"
          readonly UPSTREAM_BRANCH="beta2.1"
          readonly DEFAULT_URL="https://cloudflare-error-page-3th.pages.dev"

          readonly PRELOAD_RACE_DIAL="1"
          readonly TCP_CONCURRENT_DIAL="4"
          readonly PROXY_CONCURRENT_DIAL="4"

          readonly KV_NAME="kv"
          readonly PAGES_PRODUCTION_BRANCH="main"
          readonly API_BASE="https://api.cloudflare.com/client/v4"

          : "${CF_ACCOUNTS:?❌ 未检测到 CF_ACCOUNTS Secrets 变量}"
          : "${ADMIN_PASS:?❌ 未检测到 ADMIN Secrets 变量}"
          : "${GITHUB_TOKEN:?❌ 未检测到 GITHUB_TOKEN 变量}"

          if [[ ! -x "${WRANGLER_BIN}" ]]; then
            echo "❌ Wrangler 未正确安装：${WRANGLER_BIN}"
            exit 1
          fi

          require_cmd() {
            command -v "$1" >/dev/null 2>&1 || {
              echo "❌ 缺少依赖：$1"
              exit 1
            }
          }

          require_cmd curl
          require_cmd jq
          require_cmd unzip
          require_cmd sha256sum
          require_cmd git

          readonly ZIP_URL="https://github.com/${UPSTREAM_REPO}/archive/refs/heads/${UPSTREAM_BRANCH}.zip"

          echo "=================================================="
          echo "🚀 EdgeTunnel 批量自动部署"
          echo "=================================================="
          echo "📦 上游仓库：${UPSTREAM_REPO}"
          echo "🌿 上游分支：${UPSTREAM_BRANCH}"
          echo "🔗 ZIP：${ZIP_URL}"
          echo "🌐 URL：${DEFAULT_URL}"
          echo "⚙️ PRELOAD_RACE_DIAL=${PRELOAD_RACE_DIAL}"
          echo "⚙️ TCP_CONCURRENT_DIAL=${TCP_CONCURRENT_DIAL}"
          echo "⚙️ PROXY_CONCURRENT_DIAL=${PROXY_CONCURRENT_DIAL}"
          echo "📦 KV：${KV_NAME}"
          echo "=================================================="

          WORK_DIR="$(mktemp -d "${RUNNER_TEMP}/edgetunnel-deploy.XXXXXX")"
          trap 'rm -rf "${WORK_DIR}"' EXIT

          SOURCE_ZIP="${WORK_DIR}/source.zip"
          SOURCE_DIR="${WORK_DIR}/source"
          DOMAIN_NEXT="${WORK_DIR}/domain.next.txt"

          mkdir -p "${SOURCE_DIR}"

          # ==========================================================
          # 下载并校验上游代码
          # ==========================================================
          echo "⬇️ 正在下载 ${UPSTREAM_BRANCH}..."

          curl -fsSL \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 2 \
            -o "${SOURCE_ZIP}" \
            "${ZIP_URL}"

          unzip -tq "${SOURCE_ZIP}"
          unzip -q "${SOURCE_ZIP}" -d "${SOURCE_DIR}"

          PAYLOAD_DIR="$([ -d "${SOURCE_DIR}" ] && find "${SOURCE_DIR}" -mindepth 1 -maxdepth 1 -type d -print -quit)"

          if [[ -z "${PAYLOAD_DIR}" || ! -d "${PAYLOAD_DIR}" ]]; then
            echo "❌ ZIP 结构异常，无法找到项目目录。"
            exit 1
          fi

          if [[ ! -f "${PAYLOAD_DIR}/_worker.js" ]]; then
            echo "❌ ${UPSTREAM_BRANCH} 中没有找到 _worker.js。"
            echo "❌ 为防止部署错误版本，本次任务终止。"
            exit 1
          fi

          rm -f "${PAYLOAD_DIR}/wrangler.toml" "${PAYLOAD_DIR}/wrangler.json" "${PAYLOAD_DIR}/wrangler.jsonc"

          SOURCE_SHA="$(sha256sum "${SOURCE_ZIP}" | awk '{print $1}')"
          readonly COMPATIBILITY_DATE="$(date -u -d '1 day ago' +%Y-%m-%d)"

          echo "🗓️ Compatibility Date：${COMPATIBILITY_DATE}"
          echo "🔐 ZIP SHA256：${SOURCE_SHA}"

          if UPSTREAM_SHA="$(
            curl -fsSL \
              --retry 3 \
              --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "User-Agent: github-actions-edgetunnel-deployer" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/commits/${UPSTREAM_BRANCH}" |
            jq -r '.sha // empty'
          )"; then
            echo "🔖 ${UPSTREAM_BRANCH} 当前提交：${UPSTREAM_SHA}"
          else
            echo "⚠️ 无法获取 GitHub 当前 commit SHA，继续部署。"
          fi

          # ==========================================================
          # 解析 CF_ACCOUNTS
          #   ACCOUNT_ID:API_TOKEN
          #   ACCOUNT_ID:GLOBAL_API_KEY:EMAIL
          # ==========================================================
          declare -a ACCOUNT_IDS=()
          declare -a CREDENTIALS=()
          declare -a AUTH_TYPES=()
          declare -a AUTH_EMAILS=()

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value}"
          }

          while IFS= read -r raw_line || [[ -n "${raw_line}" ]]; do
            line="$(trim "${raw_line}")"
            [[ -z "${line}" ]] && continue
            [[ "${line}" =~ ^# ]] && continue

            account_id=""
            credential=""
            email=""
            extra=""
            IFS=':' read -r account_id credential email extra <<< "${line}"

            account_id="$(trim "${account_id}")"
            credential="$(trim "${credential}")"
            email="$(trim "${email}")"
            extra="$(trim "${extra}")"

            if [[ -n "${extra}" ]]; then
              echo "❌ CF_ACCOUNTS 格式错误：该行包含过多冒号。"
              echo "   支持：ACCOUNT_ID:API_TOKEN"
              echo "   或：ACCOUNT_ID:GLOBAL_API_KEY:EMAIL"
              exit 1
            fi

            if [[ -z "${email}" ]]; then
              auth_type="api_token"
            else
              auth_type="global_key"
            fi

            if [[ ! "${account_id}" =~ ^[A-Fa-f0-9]{32}$ ]]; then
              echo "❌ 无效 Account ID：${account_id}"
              exit 1
            fi

            if [[ -z "${credential}" ]]; then
              echo "❌ Account ${account_id} 的凭证为空。"
              exit 1
            fi

            if [[ "${auth_type}" == "global_key" &&
                  ! "${email}" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
              echo "❌ Account ${account_id} 的 Global API Key 邮箱格式无效。"
              exit 1
            fi

            ACCOUNT_IDS+=("${account_id}")
            CREDENTIALS+=("${credential}")
            AUTH_TYPES+=("${auth_type}")
            AUTH_EMAILS+=("${email}")
          done <<< "${CF_ACCOUNTS}"

          readonly ACCOUNT_COUNT="${#ACCOUNT_IDS[@]}"

          if (( ACCOUNT_COUNT == 0 )); then
            echo "❌ CF_ACCOUNTS 没有有效账号。"
            exit 1
          fi

          echo "📦 共检测到 ${ACCOUNT_COUNT} 个 Cloudflare 账号。"

          # ==========================================================
          # UUID 配置
          # UUID_CONFIG：项目序号:UUIDv4
          # 目标项目会先校验现有 UUID 必须与 Secret 一致；
          # 随后所有项目都明确写入同一个 UUID，避免 Wrangler 配置源
          # 因遗漏 UUID 而清掉已有值。
          # ==========================================================
          UUID_TARGET_INDEX=""
          UUID_VALUE=""
          UUID_VALID=false

          if [[ -n "${UUID_CONFIG:-}" ]]; then
            if [[ "${UUID_CONFIG}" =~ ^([0-9]+):([[:xdigit:]]{8}-[[:xdigit:]]{4}-4[[:xdigit:]]{3}-[89abAB][[:xdigit:]]{3}-[[:xdigit:]]{12})$ ]]; then
              UUID_TARGET_INDEX="${BASH_REMATCH[1]}"
              UUID_VALUE="${BASH_REMATCH[2]}"

              if (( UUID_TARGET_INDEX >= 1 && UUID_TARGET_INDEX <= ACCOUNT_COUNT )); then
                UUID_VALID=true
                echo "🧩 UUID 聚合：来源项目=${UUID_TARGET_INDEX}"
                echo "   其他项目统一使用同一个 UUID。"
              else
                echo "⚠️ UUID 项目序号 ${UUID_TARGET_INDEX} 超出当前账号数量。"
                echo "⚠️ 本次跳过 UUID 聚合。"
              fi
            else
              echo "⚠️ UUID 配置格式无效。"
              echo "⚠️ 正确格式：项目序号:UUIDv4"
              echo "⚠️ 本次跳过 UUID 聚合。"
            fi
          else
            echo "ℹ️ 未配置 UUID 聚合。"
          fi

          # ==========================================================
          # Cloudflare API
          # GET 使用重试；POST/PATCH 不使用自动重试，避免非幂等操作
          # 因超时重复创建资源。
          # ==========================================================
          api_request() {
            local index="$1"
            local method="$2"
            local url="$3"
            local data="${4:-}"
            local -a headers=("-H" "Content-Type: application/json")

            if [[ "${AUTH_TYPES[$index]}" == "global_key" ]]; then
              headers+=(
                "-H" "X-Auth-Email: ${AUTH_EMAILS[$index]}"
                "-H" "X-Auth-Key: ${CREDENTIALS[$index]}"
              )
            else
              headers+=("-H" "Authorization: Bearer ${CREDENTIALS[$index]}")
            fi

            if [[ "${method}" == "GET" ]]; then
              curl -fsSL \
                --retry 4 \
                --retry-all-errors \
                --retry-delay 2 \
                "${headers[@]}" \
                "${url}"
              return
            fi

            if [[ -n "${data}" ]]; then
              curl -sS \
                -X "${method}" \
                "${headers[@]}" \
                --data "${data}" \
                "${url}"
            else
              curl -sS \
                -X "${method}" \
                "${headers[@]}" \
                "${url}"
            fi
          }

          api_get() { api_request "$1" GET "$2"; }
          api_post() { api_request "$1" POST "$2" "$3"; }

          # ==========================================================
          # 生成完整 Wrangler 配置
          # 说明：Pages 官方文档要求使用 Wrangler 配置文件时把它视为
          # 项目配置的 source of truth；vars / kv_namespaces 应直接写入。
          # ==========================================================
          write_wrangler_config() {
            local index="$1"
            local project_name="$2"
            local kv_id="$3"
            local uuid_value="${4:-}"

            local config_file="${PAYLOAD_DIR}/wrangler.json"

            if [[ -n "${uuid_value}" ]]; then
              jq -n \
                --arg name "${project_name}" \
                --arg output "." \
                --arg compatibility_date "${COMPATIBILITY_DATE}" \
                --arg admin "${ADMIN_PASS}" \
                --arg url "${DEFAULT_URL}" \
                --arg preload "${PRELOAD_RACE_DIAL}" \
                --arg tcp "${TCP_CONCURRENT_DIAL}" \
                --arg proxy "${PROXY_CONCURRENT_DIAL}" \
                --arg uuid "${uuid_value}" \
                --arg kv_id "${kv_id}" \
                '{
                  name: $name,
                  pages_build_output_dir: $output,
                  compatibility_date: $compatibility_date,
                  vars: {
                    ADMIN: $admin,
                    URL: $url,
                    PRELOAD_RACE_DIAL: $preload,
                    TCP_CONCURRENT_DIAL: $tcp,
                    PROXY_CONCURRENT_DIAL: $proxy,
                    UUID: $uuid
                  },
                  kv_namespaces: [
                    {binding: "KV", id: $kv_id}
                  ]
                }' > "${config_file}"
              echo "📄 Wrangler 配置已生成：5 个变量 + UUID + KV"
            else
              jq -n \
                --arg name "${project_name}" \
                --arg output "." \
                --arg compatibility_date "${COMPATIBILITY_DATE}" \
                --arg admin "${ADMIN_PASS}" \
                --arg url "${DEFAULT_URL}" \
                --arg preload "${PRELOAD_RACE_DIAL}" \
                --arg tcp "${TCP_CONCURRENT_DIAL}" \
                --arg proxy "${PROXY_CONCURRENT_DIAL}" \
                --arg kv_id "${kv_id}" \
                '{
                  name: $name,
                  pages_build_output_dir: $output,
                  compatibility_date: $compatibility_date,
                  vars: {
                    ADMIN: $admin,
                    URL: $url,
                    PRELOAD_RACE_DIAL: $preload,
                    TCP_CONCURRENT_DIAL: $tcp,
                    PROXY_CONCURRENT_DIAL: $proxy
                  },
                  kv_namespaces: [
                    {binding: "KV", id: $kv_id}
                  ]
                }' > "${config_file}"
              echo "📄 Wrangler 配置已生成：5 个变量 + KV"
            fi

            jq empty "${config_file}"
          }

          run_pages_deploy() {
            local index="$1"
            local account_id="${ACCOUNT_IDS[$index]}"
            local project_name="$((index + 1))"

            if [[ "${AUTH_TYPES[$index]}" == "api_token" ]]; then
              env \
                -u CLOUDFLARE_API_KEY \
                -u CLOUDFLARE_EMAIL \
                CLOUDFLARE_ACCOUNT_ID="${account_id}" \
                CLOUDFLARE_API_TOKEN="${CREDENTIALS[$index]}" \
                "${WRANGLER_BIN}" pages deploy . \
                  --project-name="${project_name}" \
                  --branch="${PAGES_PRODUCTION_BRANCH}" \
                  --commit-dirty=true
            else
              env \
                -u CLOUDFLARE_API_TOKEN \
                CLOUDFLARE_ACCOUNT_ID="${account_id}" \
                CLOUDFLARE_API_KEY="${CREDENTIALS[$index]}" \
                CLOUDFLARE_EMAIL="${AUTH_EMAILS[$index]}" \
                "${WRANGLER_BIN}" pages deploy . \
                  --project-name="${project_name}" \
                  --branch="${PAGES_PRODUCTION_BRANCH}" \
                  --commit-dirty=true
            fi
          }

          # ==========================================================
          # 获取 Pages 自定义域
          # 优先 active 非 pages.dev，自定义域不可用时回退 subdomain。
          # ==========================================================
          get_preferred_domain() {
            local index="$1"
            local project_name="$2"
            local project_json="$3"
            local domains_json=""
            local custom_domain=""
            local pages_subdomain=""

            pages_subdomain="$(jq -r '.result.subdomain // empty' <<< "${project_json}")"

            if domains_json="$(api_get "${index}" "${API_BASE}/accounts/${ACCOUNT_IDS[$index]}/pages/projects/${project_name}/domains")"; then
              custom_domain="$(
                jq -r '
                  [
                    .result[]?
                    | select(
                        (.name // "") != ""
                        and ((.name | ascii_downcase) | endswith(".pages.dev") | not)
                        and (.status == "active")
                      )
                  ]
                  | sort_by(.name)
                  | .[0].name // empty
                ' <<< "${domains_json}"
              )"
            else
              echo "⚠️ 无法读取 Pages 自定义域列表，将使用 pages.dev。" >&2
            fi

            if [[ -n "${custom_domain}" ]]; then
              printf '%s\n' "${custom_domain}"
            else
              printf '%s\n' "${pages_subdomain}"
            fi
          }

          # ==========================================================
          # 输出实际配置诊断（不打印 ADMIN 等敏感值）
          # ==========================================================
          print_config_mismatch() {
            local project_json="$1"
            local expected_kv="$2"
            local expect_uuid="$3"

            echo "🔎 Cloudflare 实际生产配置摘要："
            jq -c '
              {
                success,
                production: {
                  env_var_keys: ((.result.deployment_configs.production.env_vars // {}) | keys),
                  kv_namespaces: (.result.deployment_configs.production.kv_namespaces // {})
                },
                wrangler_config_hash: (.result.wrangler_config_hash // null),
                errors,
                messages
              }
            ' <<< "${project_json}" 2>/dev/null || true

            echo "🔎 字段校验结果："
            jq -r \
              --arg admin "${ADMIN_PASS}" \
              --arg url "${DEFAULT_URL}" \
              --arg preload "${PRELOAD_RACE_DIAL}" \
              --arg tcp "${TCP_CONCURRENT_DIAL}" \
              --arg proxy "${PROXY_CONCURRENT_DIAL}" \
              --arg kv "${expected_kv}" \
              --arg uuid "${expect_uuid}" \
              '
                .result.deployment_configs.production as $p |
                [
                  ["ADMIN", (($p.env_vars.ADMIN.value // "") == $admin)],
                  ["URL", (($p.env_vars.URL.value // "") == $url)],
                  ["PRELOAD_RACE_DIAL", (($p.env_vars.PRELOAD_RACE_DIAL.value // "") == $preload)],
                  ["TCP_CONCURRENT_DIAL", (($p.env_vars.TCP_CONCURRENT_DIAL.value // "") == $tcp)],
                  ["PROXY_CONCURRENT_DIAL", (($p.env_vars.PROXY_CONCURRENT_DIAL.value // "") == $proxy)],
                  ["KV", (($p.kv_namespaces.KV.namespace_id // "") == $kv)]
                ] +
                (if $uuid != "" then [["UUID", (($p.env_vars.UUID.value // "") == $uuid)]] else [] end)
                | .[] | "   \(. [0]): \(if .[1] then "OK" else "MISMATCH" end)"
              ' <<< "${project_json}" 2>/dev/null || true
          }

          declare -a ADMIN_DOMAINS=()
          declare -a HOST_DOMAINS=()
          declare -a FAILED_PROJECTS=()
          DEPLOYED_COUNT=0

          # ==========================================================
          # 部署单个账号
          # ==========================================================
          deploy_one() {
            local index="$1"
            local account_id="${ACCOUNT_IDS[$index]}"
            local project_name="$((index + 1))"
            local project_resp=""
            local create_resp=""
            local kv_list=""
            local kv_id=""
            local host=""
            local final_url=""
            local deploy_uuid=""
            local existing_uuid=""

            echo ""
            echo "=================================================="
            echo "🚀 第 ${project_name} 个账号"
            echo "   Account ID: ${account_id}"
            echo "   Pages 项目: ${project_name}"
            echo "=================================================="

            # ----------------------------------------------------------
            # 1. 检查 / 创建 Pages 项目
            # ----------------------------------------------------------
            if project_resp="$(api_get "${index}" "${API_BASE}/accounts/${account_id}/pages/projects/${project_name}")"; then
              if jq -e '.success == true and (.result.name // "") != ""' >/dev/null <<< "${project_resp}"; then
                echo "✅ Pages 项目已存在。"
              else
                project_resp=""
              fi
            else
              project_resp=""
            fi

            if [[ -z "${project_resp}" ]]; then
              echo "📁 Pages 项目不存在，正在创建..."
              create_resp="$(
                api_post \
                  "${index}" \
                  "${API_BASE}/accounts/${account_id}/pages/projects" \
                  "$(jq -nc --arg name "${project_name}" --arg branch "${PAGES_PRODUCTION_BRANCH}" '{name:$name,production_branch:$branch}')"
              )"

              if ! jq -e '.success == true and (.result.name // "") != ""' >/dev/null <<< "${create_resp}"; then
                echo "❌ 创建 Pages 项目失败："
                jq -c '{success,errors,messages}' <<< "${create_resp}" 2>/dev/null || true
                return 1
              fi

              project_resp="${create_resp}"
              echo "✅ Pages 项目创建成功。"
            fi

            # ----------------------------------------------------------
            # 2. 检查 / 创建 KV
            # ----------------------------------------------------------
            echo "📦 检查 KV：${KV_NAME}"
            if ! kv_list="$(api_get "${index}" "${API_BASE}/accounts/${account_id}/storage/kv/namespaces")"; then
              echo "❌ 无法读取 KV 列表。"
              return 1
            fi

            if ! jq -e '.success == true and (.result | type == "array")' >/dev/null <<< "${kv_list}"; then
              echo "❌ KV API 返回异常："
              jq -c '{success,errors,messages}' <<< "${kv_list}" 2>/dev/null || true
              return 1
            fi

            kv_id="$(jq -r --arg title "${KV_NAME}" '.result[] | select(.title == $title) | .id' <<< "${kv_list}" | head -n 1)"

            if [[ -z "${kv_id}" || "${kv_id}" == "null" ]]; then
              echo "📦 未找到 '${KV_NAME}'，正在创建..."
              create_resp="$(
                api_post \
                  "${index}" \
                  "${API_BASE}/accounts/${account_id}/storage/kv/namespaces" \
                  "$(jq -nc --arg title "${KV_NAME}" '{title:$title}')"
              )"

              if ! jq -e '.success == true and (.result.id // "") != ""' >/dev/null <<< "${create_resp}"; then
                echo "❌ 创建 KV 失败："
                jq -c '{success,errors,messages}' <<< "${create_resp}" 2>/dev/null || true
                return 1
              fi

              kv_id="$(jq -r '.result.id' <<< "${create_resp}")"
              echo "✅ KV 创建成功：${kv_id}"
            else
              echo "✅ 已存在 KV：${kv_id}"
            fi

            # ----------------------------------------------------------
            # 3. 确定 UUID
            # ----------------------------------------------------------
            if [[ "${UUID_VALID}" == true ]]; then
              if [[ "${project_name}" == "${UUID_TARGET_INDEX}" ]]; then
                existing_uuid="$(jq -r '.result.deployment_configs.production.env_vars.UUID.value // empty' <<< "${project_resp}")"
                if [[ -z "${existing_uuid}" ]]; then
                  echo "❌ UUID 来源项目 ${project_name} 当前没有生产 UUID。"
                  echo "❌ UUID Secret 指定了来源项目，因此不会猜测或自动生成 UUID。"
                  return 1
                fi

                if [[ "${existing_uuid,,}" != "${UUID_VALUE,,}" ]]; then
                  echo "❌ UUID 来源项目 ${project_name} 的现有 UUID 与 UUID Secret 不一致。"
                  echo "❌ 为避免错误聚合，本次项目部署停止。"
                  return 1
                fi

                deploy_uuid="${UUID_VALUE}"
              else
                deploy_uuid="${UUID_VALUE}"
              fi
            fi

            # ----------------------------------------------------------
            # 4. 生成完整 Wrangler 配置
            # ----------------------------------------------------------
            write_wrangler_config "${index}" "${project_name}" "${kv_id}" "${deploy_uuid}"

            # ----------------------------------------------------------
            # 5. 部署；仅在 Wrangler 本身失败时重试一次
            # ----------------------------------------------------------
            echo "🌐 正在部署 Pages 项目 ${project_name}..."
            if ! (cd "${PAYLOAD_DIR}" && run_pages_deploy "${index}"); then
              echo "⚠️ 第 ${project_name} 个项目首次部署失败，重试一次..."
              if ! (cd "${PAYLOAD_DIR}" && run_pages_deploy "${index}"); then
                echo "❌ 第 ${project_name} 个项目部署失败。"
                return 1
              fi
            fi

            # ----------------------------------------------------------
            # 6. 部署后读取并严格验证生产配置
            # ----------------------------------------------------------
            project_resp="$(api_get "${index}" "${API_BASE}/accounts/${account_id}/pages/projects/${project_name}")" || {
              echo "❌ 部署成功后无法读取 Pages 项目。"
              return 1
            }

            if ! jq -e \
              --arg admin "${ADMIN_PASS}" \
              --arg url "${DEFAULT_URL}" \
              --arg preload "${PRELOAD_RACE_DIAL}" \
              --arg tcp "${TCP_CONCURRENT_DIAL}" \
              --arg proxy "${PROXY_CONCURRENT_DIAL}" \
              --arg kv_id "${kv_id}" \
              --arg uuid "${deploy_uuid}" \
              '.success == true
               and (.result.deployment_configs.production.env_vars.ADMIN.value // "") == $admin
               and (.result.deployment_configs.production.env_vars.URL.value // "") == $url
               and (.result.deployment_configs.production.env_vars.PRELOAD_RACE_DIAL.value // "") == $preload
               and (.result.deployment_configs.production.env_vars.TCP_CONCURRENT_DIAL.value // "") == $tcp
               and (.result.deployment_configs.production.env_vars.PROXY_CONCURRENT_DIAL.value // "") == $proxy
               and (.result.deployment_configs.production.kv_namespaces.KV.namespace_id // "") == $kv_id
               and ($uuid == "" or (.result.deployment_configs.production.env_vars.UUID.value // "") == $uuid)' \
              >/dev/null <<< "${project_resp}"; then
              echo "❌ 部署后生产配置验证失败，不再用 API PATCH 与 Wrangler 反复覆盖。"
              print_config_mismatch "${project_resp}" "${kv_id}" "${deploy_uuid}"
              return 1
            fi

            if [[ -n "${deploy_uuid}" ]]; then
              echo "✅ Pages 环境变量已随 Wrangler 部署并验证：ADMIN / URL / PRELOAD_RACE_DIAL / TCP_CONCURRENT_DIAL / PROXY_CONCURRENT_DIAL / UUID"
            else
              echo "✅ Pages 环境变量已随 Wrangler 部署并验证：ADMIN / URL / PRELOAD_RACE_DIAL / TCP_CONCURRENT_DIAL / PROXY_CONCURRENT_DIAL"
            fi
            echo "✅ Pages KV 绑定已验证：KV -> ${kv_id}"

            # ----------------------------------------------------------
            # 7. 获取最终域名
            # ----------------------------------------------------------
            host=""
            for attempt in 1 2 3 4 5; do
              host="$(get_preferred_domain "${index}" "${project_name}" "${project_resp}" || true)"
              host="$(trim "${host}")"

              if [[ -n "${host}" ]]; then
                break
              fi

              if (( attempt < 5 )); then
                echo "⏳ 获取最终域名第 ${attempt}/5 次失败，等待 2 秒..."
                sleep 2
                project_resp="$(api_get "${index}" "${API_BASE}/accounts/${account_id}/pages/projects/${project_name}" || true)"
              fi
            done

            if [[ -z "${host}" ]]; then
              echo "❌ 部署成功，但没有获取到可用域名。"
              return 1
            fi

            host="${host#https://}"
            host="${host#http://}"
            host="${host%%/*}"
            host="${host%.}"

            if [[ -z "${host}" ]]; then
              echo "❌ 域名清理后为空。"
              return 1
            fi

            final_url="https://${host}/admin"
            echo "🔗 管理地址：${final_url}"
            echo "🌐 Host：${host}"

            ADMIN_DOMAINS[$index]="${final_url}"
            HOST_DOMAINS[$index]="${host}"
            DEPLOYED_COUNT=$((DEPLOYED_COUNT + 1))

            echo "🎉 第 ${project_name} 个项目处理完成。"
          }

          # ==========================================================
          # 逐账号部署
          # ==========================================================
          for ((i=0; i<ACCOUNT_COUNT; i++)); do
            if ! deploy_one "${i}"; then
              FAILED_PROJECTS+=("$((i + 1))")
            fi
          done

          # ==========================================================
          # 同步最新远端 domain.txt
          # ==========================================================
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${GITHUB_REF_NAME}" --quiet

          if git cat-file -e "origin/${GITHUB_REF_NAME}:domain.txt" 2>/dev/null; then
            git checkout "origin/${GITHUB_REF_NAME}" -- domain.txt
          else
            rm -f domain.txt
          fi

          declare -a OLD_ADMIN_DOMAINS=()
          declare -a OLD_HOST_DOMAINS=()

          if [[ -f domain.txt ]]; then
            section="admin"
            while IFS= read -r old_domain || [[ -n "${old_domain}" ]]; do
              old_domain="${old_domain%$'\r'}"
              if [[ -z "${old_domain}" ]]; then
                section="host"
                continue
              fi

              if [[ "${section}" == "admin" ]]; then
                OLD_ADMIN_DOMAINS+=("${old_domain}")
              else
                OLD_HOST_DOMAINS+=("${old_domain}")
              fi
            done < domain.txt

            if (( ${#OLD_HOST_DOMAINS[@]} == 0 && ${#OLD_ADMIN_DOMAINS[@]} > 0 )); then
              for old_domain in "${OLD_ADMIN_DOMAINS[@]}"; do
                if [[ "${old_domain}" =~ ^https?://([^/]+)/admin/?$ ]]; then
                  OLD_HOST_DOMAINS+=("${BASH_REMATCH[1]}")
                else
                  OLD_HOST_DOMAINS+=("")
                fi
              done
            fi
          fi

          # 失败项目保留旧域名，仅用于展示；但只要有失败，最终不提交 domain.txt。
          for ((i=0; i<ACCOUNT_COUNT; i++)); do
            if [[ -z "${ADMIN_DOMAINS[$i]:-}" && -n "${OLD_ADMIN_DOMAINS[$i]:-}" ]]; then
              ADMIN_DOMAINS[$i]="${OLD_ADMIN_DOMAINS[$i]}"
            fi
            if [[ -z "${HOST_DOMAINS[$i]:-}" && -n "${OLD_HOST_DOMAINS[$i]:-}" ]]; then
              HOST_DOMAINS[$i]="${OLD_HOST_DOMAINS[$i]}"
            fi
          done

          if (( ${#FAILED_PROJECTS[@]} == 0 )); then
            : > "${DOMAIN_NEXT}"
            for ((i=0; i<ACCOUNT_COUNT; i++)); do
              printf '%s\n' "${ADMIN_DOMAINS[$i]}" >> "${DOMAIN_NEXT}"
            done
            printf '\n' >> "${DOMAIN_NEXT}"
            for ((i=0; i<ACCOUNT_COUNT; i++)); do
              printf '%s\n' "${HOST_DOMAINS[$i]}" >> "${DOMAIN_NEXT}"
            done
          else
            echo "⚠️ 检测到失败项目，本次不更新 domain.txt，避免列表与项目序号错位。"
            rm -f "${DOMAIN_NEXT}"
          fi

          echo ""
          echo "┌────┬─────────────────────────────────────────────────────┐"
          echo "│ ID │ 最终管理地址                                        │"
          echo "├────┼─────────────────────────────────────────────────────┤"
          for ((i=0; i<ACCOUNT_COUNT; i++)); do
            printf '│ %2d │ %-51s │\n' "$((i + 1))" "${ADMIN_DOMAINS[$i]:-失败/无域名}"
          done
          echo "└────┴─────────────────────────────────────────────────────┘"

          if (( ${#FAILED_PROJECTS[@]} == 0 )); then
            echo ""
            echo "================ domain.txt ================"
            cat "${DOMAIN_NEXT}"
            echo "============================================="

            if [[ -f domain.txt ]] && cmp -s "${DOMAIN_NEXT}" domain.txt; then
              echo "✨ domain.txt 内容无变化，跳过 Commit。"
              rm -f "${DOMAIN_NEXT}"
            else
              mv "${DOMAIN_NEXT}" domain.txt
              git add domain.txt
              git commit -m "chore: auto update deployed domains list [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
              echo "✅ domain.txt 已推送到 GitHub。"
            fi
          fi

          if (( ${#FAILED_PROJECTS[@]} > 0 )); then
            echo ""
            echo "❌ 以下项目本次未完整完成：${FAILED_PROJECTS[*]}"
            echo "ℹ️ 已成功部署：${DEPLOYED_COUNT}/${ACCOUNT_COUNT}"
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "🎉 全部 ${ACCOUNT_COUNT} 个项目部署完成！"
          echo "=================================================="
