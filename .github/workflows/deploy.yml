name: 批量自动部署至 Cloudflare Pages

on:
  push:
    branches:
      - main  # 配合 sync.yml，上游同步更新 main 分支后自动触发
  workflow_dispatch: # 支持在 GitHub 界面手动运行

permissions:
  contents: write  # 允许更新并提交 domain.txt 至仓库

jobs:
  batch-deploy:
    name: Batch Deploy & Update Domain List
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler CLI
        run: npm install -g wrangler@latest

      - name: Process, Deploy and Collect Domains
        shell: bash
        env:
          CF_ACCOUNTS: ${{ secrets.CF_ACCOUNTS }}
          ADMIN_PASS: ${{ secrets.ADMIN }}
        run: |
          if [ -z "$CF_ACCOUNTS" ]; then
            echo "❌ [ERROR] 未检测到 CF_ACCOUNTS Secrets 变量！"
            exit 1
          fi

          if [ -z "$ADMIN_PASS" ]; then
            echo "❌ [ERROR] 未检测到 ADMIN Secrets 变量！"
            exit 1
          fi

          # 初始化/清空临时域名记录文件
          > domain_temp.txt

          # 初始化账号序号
          INDEX=1

          # 逐行读取多账号配置 (格式: ACCOUNT_ID:API_TOKEN)
          while IFS= read -r line || [ -n "$line" ]; do
            # 去除首尾空白
            line=$(echo "$line" | xargs)
            
            # 过滤空行与注释行
            if [[ -z "$line" || "$line" =~ ^# ]]; then
              continue
            fi

            # 使用 Bash 原生截取，规避频繁创建子进程
            ACCOUNT_ID=$(echo "${line%%:*}" | xargs)
            API_TOKEN=$(echo "${line#*:}" | xargs)
            PROJECT_NAME="${INDEX}"

            echo "=================================================="
            echo "🚀 正在处理第 ${INDEX} 个账号 [ID: ${ACCOUNT_ID}] -> 项目名: ${PROJECT_NAME}"
            echo "=================================================="

            # 1. 查询或创建名称为 kv 的命名空间 (去特征化)
            KV_NAME="kv"
            
            KV_LIST_RESP=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json")

            KV_ID=$(echo "$KV_LIST_RESP" | jq -r ".result[]? | select(.title==\"${KV_NAME}\") | .id")

            if [ -z "$KV_ID" ] || [ "$KV_ID" == "null" ]; then
              echo "📦 未检测到名称为 '${KV_NAME}' 的 KV 空间，正在创建..."
              CREATE_KV_RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/storage/kv/namespaces" \
                -H "Authorization: Bearer ${API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"title\":\"${KV_NAME}\"}")
              
              KV_ID=$(echo "$CREATE_KV_RESP" | jq -r ".result.id")
              if [ -z "$KV_ID" ] || [ "$KV_ID" == "null" ]; then
                echo "❌ 创建 KV 空间失败，详细响应: ${CREATE_KV_RESP}"
                echo "⚠️ 跳过当前账号，处理下一个..."
                INDEX=$((INDEX + 1))
                continue
              fi
              echo "✅ KV 空间创建成功，ID: ${KV_ID}"
            else
              echo "✅ 检测到已存在 KV 空间，ID: ${KV_ID}"
            fi

            # 2. 动态生成干净的 wrangler.toml 配置文件
            cat <<EOF > wrangler.toml
name = "${PROJECT_NAME}"
compatibility_date = "2025-11-04"
pages_build_output_dir = "."

[vars]
ADMIN = "${ADMIN_PASS}"
URL = "https://cloudflare-error-page-3th.pages.dev"
PRELOAD_RACE_DIAL = "1"
TCP_CONCURRENT_DIAL = "4"
PROXY_CONCURRENT_DIAL = "4"

[[kv_namespaces]]
binding = "KV"
id = "${KV_ID}"
EOF

            # 3. 隔离环境部署（清除 Wrangler 全局缓存防止账号信息遗留污染）
            (
              rm -rf ~/.config/.wrangler
              export CLOUDFLARE_ACCOUNT_ID="${ACCOUNT_ID}"
              export CLOUDFLARE_API_TOKEN="${API_TOKEN}"

              echo "🌐 正在推送代码部署至 Cloudflare Pages (项目名: ${PROJECT_NAME})..."
              wrangler pages deploy . --project-name="${PROJECT_NAME}" --branch=main --commit-dirty=true
            )

            # 4. 获取分配的域名并清洗后缀
            PROJECT_RESP=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json")
            
            SUBDOMAIN=$(echo "$PROJECT_RESP" | jq -r ".result.subdomain // empty")

            if [ -n "$SUBDOMAIN" ] && [ "$SUBDOMAIN" != "null" ]; then
              CLEAN_SUBDOMAIN="${SUBDOMAIN%.pages.dev}"
              FINAL_URL="https://${CLEAN_SUBDOMAIN}.pages.dev/admin"
            else
              FINAL_URL="https://${PROJECT_NAME}.pages.dev/admin"
            fi

            echo "🔗 部署成功，面板地址: ${FINAL_URL}"
            echo "${FINAL_URL}" >> domain_temp.txt
            echo "🎉 第 ${INDEX} 个账号处理完成！"
            
            INDEX=$((INDEX + 1))
          done <<< "$CF_ACCOUNTS"

          # 清理本地生成的 wrangler.toml，还原工作区状态
          git checkout wrangler.toml 2>/dev/null || rm -f wrangler.toml

      - name: Update domain.txt conditionally
        shell: bash
        run: |
          if [ -f domain_temp.txt ]; then
            sort -u domain_temp.txt -o domain.txt
            rm -f domain_temp.txt
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --name-only | grep -q "^domain.txt$"; then
            echo "📝 检测到 domain.txt 内容有更新，准备提交..."
            git add domain.txt
            git commit -m "chore: auto update deployed domains list [skip ci]"
            git push
            echo "✅ domain.txt 已推送到 GitHub 仓库！"
          else
            echo "✨ domain.txt 内容无变化，跳过 Commit 提交。"
          fi
